desempenho e permitindo a entrada de novos hosts sem comprometer o sistema, é viabilizada por arquiteturas de sistema operacional baseadas em máquinas virtuais, que isolam e escalam recursos dinamicamente."},{"id":"2017-23","ano":2017,"n":23,"area":"Banco de Dados","enunciado":"No modelo de dados relacional, uma junção entre tabelas cria uma pseudo-tabela derivada de duas ou mais tabelas de acordo com os critérios especificados, similar às regras da teoria dos conjuntos. Nos conjuntos apresentados na prova, as áreas hachuradas representam os resultados das consultas SQL (padrão) em que id é uma chave primária e fk é uma chave estrangeira, exemplificando: união (SELECT * FROM Tabela1 UNION SELECT * FROM Tabela2), interseção (INNER JOIN) e junção à esquerda (LEFT JOIN).\n\nAssinale a opção em que a declaração SQL é equivalente ao conjunto apresentado a seguir (representando Tabela1 menos a interseção com Tabela2, ou seja, os elementos de Tabela1 que NÃO possuem correspondência em Tabela2):","alt":["SELECT * FROM Tabela1 t1 JOIN Tabela2 t2 ON t1.id = t2.fk;","SELECT * FROM Tabela1 t1 RIGHT JOIN Tabela2 t2 ON t1.id = t2.fk WHERE t2.fk <> NULL;","SELECT * FROM Tabela1 t1 WHERE EXISTS (SELECT 1 FROM Tabela2 t2 WHERE t2.id = t1.fk);","SELECT * FROM Tabela1 t1 LEFT JOIN Tabela2 t2 ON t1.id = t2.fk WHERE t2.id IS NULL;","SELECT * FROM Tabela1 t1 WHERE NOT EXISTS (SELECT 1 FROM Tabela2 t2 WHERE t2.id = t1.fk);"],"correct":"D","anulada":false,"exp":"A área hachurada representando Tabela1 menos a interseção com Tabela2 corresponde a um LEFT JOIN filtrado pelas linhas em que não há correspondência na segunda tabela (t2.id IS NULL) — exatamente a lógica da alternativa D."},{"id":"2017-24","ano":2017,"n":24,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"Em uma pesquisa de satisfação com notas de 0 a 10, sendo 0 muito insatisfeito e 10 muito satisfeito, uma empresa construiu um quadro com o resumo das notas atribuídas pelos seus clientes aos serviços recebidos:\n\nNota (0 a 10) / Quantidade de clientes: 0→0; 1→0; 2→0; 3→4; 4→2; 5→2; 6→2; 7→2; 8→2; 9→1; 10→0.\n\nConsiderando essa situação e as informações apresentadas, avalie as afirmações a seguir.\n\nI. A média das notas dos clientes é igual a 6,0.\nII. A mediana das notas dos clientes é igual a 6,0.\nIII. O desvio padrão populacional é menor do que 3,0.\nIV. O conjunto de dados é amodal.\nV. Um cliente que atribuiu nota 3,0 encontra-se no 1º quartil.\n\nÉ correto apenas o que se afirma em:","alt":["I, II e III.","I, II e V.","I, III e IV.","I, IV e V.","II, IV e V."],"correct":"B","anulada":false,"exp":"Com as 15 notas informadas (3,3,3,3,4,4,5,5,6,6,7,7,8,8,9), a média e a mediana coincidem em 6,0 (I e II verdadeiras); e o cliente que deu nota 3,0 está entre os valores mais baixos do conjunto, no primeiro quartil (V verdadeira)."},{"id":"2017-25","ano":2017,"n":25,"area":"Engenharia de Software","enunciado":"Nos últimos anos, a melhoria do desempenho organizacional por meio da identificação, avaliação e melhoria dos processos de negócio organizacionais tem-se tornado uma prática padrão nas organizações ao redor do mundo e tem sido reconhecida como uma disciplina, denominada Gestão de Processos de Negócio.\n\nO primeiro passo da gestão de processos é identificar que processo de negócio se deseja melhorar. Sem clarificar exatamente qual é o processo, torna-se difícil controlar o escopo de um projeto de melhoria de processos, pois, em qualquer organização, todas as atividades estão, de alguma forma, relacionadas.\n\nSHARP, A.; MCDERMOTT, P. Workflow modeling. 2. ed. Boston: Artech House, 2009 (adaptado).\n\nConsiderando as informações apresentadas, assinale a opção que corresponde a um processo de negócio que deve ser selecionado para análise pelo projeto de melhoria de processos de uma organização.","alt":["Criar conta de cliente.","Prospectar novos clientes.","Comércio eletrônico via Web.","Relacionamento com clientes.","Calcular a faixa de crédito de cliente."],"correct":"B","anulada":false,"exp":"Um processo de negócio adequado para análise de melhoria precisa ser específico e delimitável — 'prospectar novos clientes' é um processo concreto e mapeável, diferente de termos amplos demais ('relacionamento com clientes') ou atividades pontuais demais ('criar conta de cliente')."},{"id":"2017-26","ano":2017,"n":26,"area":"Lógica e Programação","enunciado":"Algumas linguagens de programação obedecem a uma ordem específica no que diz respeito à avaliação de operadores. A precedência dos operadores aritméticos, relacionais e booleanos é demonstrada na tabela a seguir, na qual os operadores ++ e --, pré ou pós-fixados, respectivamente, incrementam ou decrementam a variável, como no exemplo: variável x com valor 0, resultado de ++x é igual a 1 e o de --x é igual a -1.\n\nOrdem de precedência (do maior para o menor):\n1) ++ e -- pós-fixados\n2) + e - unários, ++ e -- pré-fixados, !\n3) *, /, %\n4) + e - binários\n5) <, >, <=, >=\n6) ==\n7) &&\n8) ||\n\nSEBESTA, R. W. Conceitos de linguagens de programação. Porto Alegre: Bookman, 2011 (adaptado).\n\nConsiderando essas informações e sabendo que as variáveis a, b e c têm, em determinado momento, os valores 1, 2 e 0, respectivamente, assinale a opção em que o resultado da expressão apresentada corresponde ao da expressão -a * ++b - --c.","alt":["a * b++ - --c","--b > a + c","--c / a * --b","++c / --b * ++a","-a * b++ - c--"],"correct":"E","anulada":false,"exp":"Aplicando a tabela de precedência (pós-fixado > pré-fixado/unário > *,/,% > +,− binário) à expressão com a=1, b=2, c=0: primeiro se resolvem os incrementos/decrementos (++b vira 3, --c vira -1), depois a multiplicação e por fim a subtração — a alternativa E reproduz essa mesma ordem de avaliação, chegando ao resultado equivalente."},{"id":"2017-27","ano":2017,"n":27,"area":"Engenharia de Software","enunciado":"A forma como o conhecimento se apresenta pode ser classificada em tácita e explícita. O conhecimento tácito é desenvolvido pelas experiências e relacionamentos pessoais ou profissionais de um indivíduo, não é mensurável e é pessoal. O conhecimento explícito é a disseminação, aplicação, transmissão, de maneira formal, do conhecimento adquirido.\n\nTAKEUCHI, H.; NONAKA, I. Gestão do conhecimento. Porto Alegre: Bookman, 2008 (adaptado).\n\nConsiderando o desenvolvimento de software e a utilização do conhecimento tácito e explícito, avalie as afirmações a seguir.\n\nI. Durante as etapas de desenvolvimento do software, são utilizados tanto os conhecimentos pré-existentes do indivíduo quanto os conhecimentos adquiridos durante o desenvolvimento.\nII. O uso do conhecimento explícito restringe-se às fases de levantamento dos requisitos, quando o usuário indica sua necessidade e as funcionalidades requeridas para o desenvolvimento do software.\nIII. O uso do conhecimento tácito restringe-se às fases de desenvolvimento, quando se emprega conhecimento de transformação da necessidade do usuário e características técnicas para produzir um sistema de informação.\n\nÉ correto o que se afirma em:","alt":["I, apenas.","II, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"correct":"A","anulada":false,"exp":"Durante o desenvolvimento de software, tanto o conhecimento prévio do desenvolvedor (tácito) quanto o conhecimento formal adquirido ao longo do projeto (explícito) são utilizados continuamente em todas as etapas, não havendo essa restrição por fase sugerida nos itens II e III."},{"id":"2017-28","ano":2017,"n":28,"area":"Engenharia de Software","enunciado":"O guia PMBOK (Project Management Body of Knowledge) orienta a gestão de projetos considerando que processos devem ser executados nas diversas fases do gerenciamento, a saber: iniciação, planejamento, execução e encerramento.\n\nEm um determinado projeto, foi desenvolvido um sistema segundo o modelo de ciclo de vida em cascata, cujas atividades são realizadas sequencialmente e sem sobreposição. Na atividade de homologação do sistema, às vésperas da data planejada de sua implantação, um usuário identificou a inviabilidade de uma funcionalidade testada, pois alguns requisitos básicos não haviam sido considerados durante o levantamento dos requisitos. A alteração que se mostrou necessária atrasou o projeto em relação à linha de base do plano do projeto.\n\nSegundo o PMBOK, pode-se considerar que a falha foi originada na fase de:","alt":["iniciação ou planejamento, em um processo da área de conhecimento gestão do tempo.","planejamento ou execução, em um processo da área de conhecimento gestão do tempo.","execução ou encerramento, em um processo da área de conhecimento gestão do tempo.","iniciação ou encerramento, em um processo da área de conhecimento gestão do escopo.","planejamento ou execução, em um processo da área de conhecimento gestão do escopo."],"correct":"E","anulada":false,"exp":"Requisitos básicos não identificados durante o levantamento de requisitos são uma falha que se origina na fase de planejamento (onde o escopo é definido); o atraso identificado na homologação é apenas o sintoma que aparece depois — a causa raiz está no escopo mal definido, área de conhecimento gestão do escopo."},{"id":"2017-29","ano":2017,"n":29,"area":"Engenharia de Software","enunciado":"Uma empresa que vende produtos cosméticos com vendas diretas conta com diferentes módulos de software que atendem aos níveis operacional, tático e estratégico. Após diagnóstico situacional, verificou-se a possibilidade de melhoria na operação e no suporte do processo \"Revisão do plano de vendas\", ilustrado por um diagrama na prova.\n\nOs atores envolvidos no processo são o setor de vendas, o departamento de vendas e a diretoria de marketing. Inicialmente, o setor de vendas faz a apuração das vendas no período. Com base nessa informação, o departamento de vendas faz a comparação entre as vendas realizadas e as previstas. Por fim, a diretoria de marketing, baseada nessa comparação, realiza o plano de vendas.\n\nNessa situação, caso se decida implementar a tecnologia BPMS (Business Process Management System), o impacto decorrente dessa implementação será:","alt":["redução do tempo de envio e recebimento dos dados entre os níveis organizacionais.","redução de despesas de vendas como decorrência da melhoria do processo.","redução na quantidade de módulos independentes necessários para operar o sistema.","maior precisão na previsão de vendas como decorrência da melhoria do processo.","maior precisão no plano de vendas como decorrência da melhoria do processo."],"correct":"A","anulada":false,"exp":"Um BPMS integra e automatiza etapas do processo entre os diferentes níveis organizacionais (vendas, departamento, diretoria), reduzindo justamente o tempo de envio e recebimento de dados entre eles, que era o gargalo relatado no cenário."},{"id":"2017-30","ano":2017,"n":30,"area":"Engenharia de Software","enunciado":"Para garantir a qualidade no desenvolvimento de software é indispensável definir processos para gerenciar mudanças no escopo do produto e configurações do software em desenvolvimento. Esses processos incluem atividades de planejamento, validação, verificação e gerenciamento de versões (mudanças ou releases).\n\nConsiderando as informações apresentadas, avalie as afirmações a seguir.\n\nI. O gerenciamento de mudanças acompanha a solicitação de alterações no software, define os custos, seus impactos e quando estas devem ser implementadas.\nII. A revisão dos artefatos de software tem por objetivo armazenar a documentação em um repositório central.\nIII. A verificação de software tem o objetivo de controle de versões da documentação.\nIV. A validação de software tem o objetivo de garantir que as necessidades e expectativas do cliente sejam atendidas.\nV. O gerenciamento de configuração controla a edição simultânea dos artefatos do software, mantém o controle das versões do software e recomenda a auditoria das configurações.\n\nÉ correto apenas o que se afirma em:","alt":["I e IV.","I e V.","I, IV e V.","II, III e IV.","I, II, III e V."],"correct":"C","anulada":false,"exp":"Gerenciamento de mudanças acompanha solicitações, custos e prazos das alterações (I verdadeira); validação garante que as necessidades do cliente sejam atendidas (IV verdadeira); e gerenciamento de configuração controla versões e edição simultânea dos artefatos (V verdadeira). Já revisão de artefatos visa qualidade/conformidade (não só armazenamento, II falsa), e verificação avalia aderência a especificações técnicas (não apenas controle de versão de documentação, III falsa)."},{"id":"2017-31","ano":2017,"n":31,"area":"Redes de Computadores","enunciado":"A cloud computing (computação em nuvem) tem o objetivo de fornecer recursos de hardware e software sob demanda a partir de servidores interligados pela internet, seguindo o princípio da computação em grid (grade). Uma arquitetura em grid é descrita por meio das quatro camadas a seguir.\n\n• Rede: executa a comunicação e se utiliza da parte física;\n• Recursos: formada pelos servidores de armazenamento e/ou processamento;\n• Middleware: formada pelo software responsável pela troca de informações;\n• Ferramentas e aplicações: representada pelos aplicativos.\n\nDe acordo com o texto, avalie as afirmações a seguir.\n\nI. A camada de ferramentas e aplicações é responsável pela negociação das transações de dados no grid.\nII. A camada middleware é responsável pela interconectividade e comunicação entre os membros do grid.\nIII. A camada de rede é responsável pela conectividade entre os diferentes membros do grid.\nIV. A camada de recursos é responsável pela segurança dos dados nas aplicações do grid.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","II e III.","III e IV.","I e IV.","I, II e III."],"correct":"B","anulada":false,"exp":"A camada de rede cuida da conectividade física entre os nós do grid (III verdadeira), e o middleware é responsável pela comunicação e troca de informações entre os membros do grid (II verdadeira); a camada de ferramentas/aplicações não trata de negociação de transações, e a camada de recursos não trata de segurança dos dados."},{"id":"2017-32","ano":2017,"n":32,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"A lei Sarbanes-Oxley (SOX), publicada em agosto de 2002, após escândalos financeiros acontecidos em companhias americanas abertas nos Estados Unidos, objetiva proteger os investidores, no mercado de capital americano, de fraudes contábeis e financeiras. Entre os diversos controles que essa lei regula, destacam-se aqueles que devem garantir a integridade de informações contábeis e financeiras. Tal crise despertou a importância da temática Governança de Tecnologia da Informação (TI) para as organizações, de modo a serem considerados requisitos legais a troca de informações entre parceiros estratégicos das organizações e a formalização de uma política de segurança da informação, entre outros. Desta forma, cabe destacar que o objetivo da Governança de TI em uma organização é alinhar a TI aos requisitos de negócio, de modo a garantir a continuidade dos serviços prestados, bem como a minimização da exposição do negócio aos riscos de TI.\n\nFERNANDES, A. A.; ABREU, V. D. Implantando a governança de TI: da estratégia à gestão dos processos e serviços. Rio de Janeiro: Brasport, 2012 (adaptado).\n\nA respeito desse contexto, avalie as afirmações a seguir.\n\nI. O atendimento a marcos de regulação (compliance) implica, para a área de TI, que os sistemas de informação transacionais de uma organização, geradores de fatos contábeis e financeiros, possibilitem o acesso e a emissão de relatórios de resultados.\nII. A segurança da informação deve ser focada prioritariamente na proteção da infraestrutura de servidores que armazenam as informações transacionais, como contábeis e financeiras.\nIII. A integração tecnológica entre filiais de uma organização, ou seja, entre elos de uma cadeia de distribuição, bem como a gestão de clientes altamente sofisticados, ou seja, entre elementos que ultrapassam as fronteiras da organização, devem ser consideradas no momento de se alinhar a TI aos requisitos de negócio.\nIV. Em grandes organizações brasileiras e multinacionais, a implementação de \"centro de serviços compartilhados\" visa centralizar diversas áreas de negócio, assim como determinadas operações e/ou serviços de TI.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","I e III.","I, III e IV.","II, III e IV.","I, II e IV."],"correct":"D","anulada":false,"exp":"Compliance exige que sistemas transacionais permitam auditoria e emissão de relatórios de resultados contábeis (I); integração entre filiais e gestão de clientes sofisticados fazem parte do alinhamento da TI ao negócio (III); centros de serviços compartilhados centralizam operações de TI em grandes organizações (IV). Já a segurança da informação deve proteger todo o ecossistema de dados, não apenas a infraestrutura de servidores, tornando II uma visão restritiva e, portanto, falsa."},{"id":"2017-33","ano":2017,"n":33,"area":"Redes de Computadores","enunciado":"Tendo em vista que a informação está entre os bens mais importantes para uma organização, um dos fatores decisivos na definição de uma rede de computadores é a segurança da informação. Para garantir tal segurança e evitar qualquer desvio ou ação que possa modificar essas informações sem autorização ou, ainda, para protegê-las de ataques cibernéticos, são necessários planejamentos e estruturação da rede e de seus acessos.\n\nFONTES, E. Praticando a segurança da informação. 1. ed. São Paulo: Brasport, 2008 (adaptado).\n\nConsiderando o texto, avalie as afirmações a seguir.\n\nI. A proteção da informação em uma organização é competência restrita à área de tecnologia, que assume total responsabilidade sobre sua segurança.\nII. A proteção da informação exige postura e comprometimento dos envolvidos na sua execução, portanto, deve ser tratada de forma profissional.\nIII. A presença de funcionários éticos na empresa elimina a necessidade de investimentos na área de segurança da informação.\nIV. Os ataques cibernéticos são cada dia mais frequentes, por isso, a segurança da informação deve ser considerada essencial.\n\nÉ correto o que se afirma em:","alt":["I, apenas.","II, apenas.","I e III, apenas.","II e IV, apenas.","I, III e IV, apenas."],"correct":"C","anulada":false,"exp":"A proteção da informação não é responsabilidade exclusiva da área de TI, mas de toda a organização (I falsa); exige postura profissional de todos os envolvidos (II verdadeira); funcionários éticos não eliminam a necessidade de investir em segurança, pois ameaças também vêm de fora (III falsa); e a crescente frequência de ataques cibernéticos reforça a importância da segurança da informação (IV verdadeira)."},{"id":"2017-34","ano":2017,"n":34,"area":"Hardware / Arquitetura e Sistemas Operacionais","enunciado":"No contexto de arquitetura e organização de computadores, o termo cluster é usado para designar um grupo de computadores interconectados, trabalhando como um recurso de computação unificado. Cada computador pertencente ao cluster é usualmente denominado nó. Clusters costumam ser utilizados em ambientes corporativos, sendo particularmente adequados para aplicações baseadas em servidores.\n\nSTALLINGS, W. Arquitetura e organização de computadores. 8. ed. São Paulo: Prentice Hall, 2010 (adaptado).\n\nConsiderando as informações apresentadas, avalie as afirmações a seguir.\n\nI. Uma falha em um nó de um cluster implica em perda total de serviço.\nII. A interligação entre os nós de um cluster realiza-se por meio de um barramento de controle.\nIII. A escalabilidade de um cluster é maior do que a de um processador com múltiplos núcleos.\nIV. A relação custo/desempenho de um cluster é melhor do que a de uma única máquina de grande porte.\n\nÉ correto apenas o que se afirma em:","alt":["I e III.","I e IV.","II e III.","II e IV.","III e IV."],"correct":"C","anulada":false,"exp":"A falha em um nó não implica necessariamente perda total do serviço, pois outros nós podem assumir a carga (I falsa); a interligação entre nós geralmente ocorre via rede, não barramento de controle (II falsa); um cluster escala horizontalmente melhor que um processador com múltiplos núcleos, que tem limite físico (III verdadeira); e a relação custo/desempenho de um cluster de máquinas comuns tende a ser melhor que uma única máquina de grande porte (IV verdadeira)."},{"id":"2017-35","ano":2017,"n":35,"area":"Lógica e Programação","enunciado":"O coordenador geral de um comitê olímpico solicitou a implementação de um aplicativo que permita o registro dos recordes dos atletas à medida que forem sendo quebrados, mantendo a ordem cronológica dos acontecimentos, e possibilitando a leitura dos dados a partir dos mais recentes.\n\nConsiderando os requisitos do aplicativo, a estrutura de dados mais adequada para a solução a ser implementada é:","alt":["o deque: tipo especial de lista encadeada, que permite a inserção e a remoção em qualquer das duas extremidades da fila e que deve possuir um nó com a informação (recorde) e dois apontadores, respectivamente, para os nós próximo e anterior.","a fila: tipo especial de lista encadeada, tal que o primeiro objeto a ser inserido na fila é o primeiro a ser lido; nesse mecanismo, conhecido como estrutura FIFO (First In - First Out), a inserção e a remoção são feitas em extremidades contrárias e a estrutura deve possuir um nó com a informação (recorde) e um apontador, respectivamente, para o próximo nó.","a pilha: tipo especial de lista encadeada, na qual o último objeto a ser inserido na fila é o primeiro a ser lido; nesse mecanismo, conhecido como estrutura LIFO (Last In - First Out), a inserção e a remoção são feitas na mesma extremidade e a estrutura deve possuir um nó com a informação (recorde) e um apontador para o próximo nó.","a fila invertida: tipo especial de lista encadeada, tal que o primeiro objeto a ser inserido na fila é o primeiro a ser lido; nesse mecanismo, conhecido como estrutura FIFO (First In - First Out), a inserção e a remoção são feitas em extremidades contrárias e a estrutura deve possuir um nó com a informação (recorde) e um apontador, respectivamente, para o nó anterior.","a lista circular: tipo especial de lista encadeada, na qual o último elemento tem como próximo o primeiro elemento da lista, formando um ciclo, não havendo diferença entre primeiro e último, e a estrutura deve possuir um nó com a informação (recorde) e um apontador, respectivamente, para o próximo nó."],"correct":"C","anulada":false,"exp":"Como é preciso manter a ordem cronológica de inserção dos recordes e depois ler a partir dos mais recentes (ordem inversa à inserção), a estrutura LIFO (pilha) é a mais adequada: o último recorde inserido é o primeiro a ser lido."},{"id":"2021-9","ano":2021,"n":9,"area":"Engenharia de Software","enunciado":"O gestor de uma instituição seguradora solicitou ao desenvolvedor de software o projeto de uma solução computacional para a instituição. Após executar a análise de requisitos, esse desenvolvedor esboçou o diagrama UML (Unified Modeling Language), contendo os elementos: classe Segurado associada (1..1 — 0..n) à classe Seguro, que é superclasse das subclasses Residencial, Automotivo e Vida.\n\nEm relação ao que é proposto no diagrama, avalie as afirmações a seguir.\n\nI. A classe Seguro é a superclasse de uma hierarquia de herança múltipla.\nII. O mecanismo de ligação entre as classes Segurado e Seguro é a associação.\nIII. As subclasses Residencial, Automotivo e Vida devem ser implementadas como classes abstratas.\nIV. É permitido que um Segurado possa adquirir várias apólices de Seguro.\n\nÉ correto apenas o que se afirma em:","alt":["I e III.","II e III.","II e IV.","I, II e IV.","I, III e IV."],"correct":"C","anulada":false,"exp":"A associação entre Segurado e Seguro (1..1 – 0..n) é uma associação simples, não herança múltipla — a classe Seguro é superclasse de herança simples (I falsa); o vínculo entre as classes é de fato uma associação (II verdadeira); as subclasses concretas não precisam ser abstratas (III falsa); e a multiplicidade 0..n permite que um segurado adquira várias apólices (IV verdadeira)."},{"id":"2021-10","ano":2021,"n":10,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"Na atual conjuntura, as organizações são pressionadas a assumirem posicionamentos cada vez mais resilientes, responsivos e inovadores. Para tanto, elas devem se empenhar na assimilação dos estímulos do ambiente (mercados físicos ou virtuais), na avaliação de suas potencialidades e limitações, bem como na proposição de valor que atenda às expectativas e seus clientes.\n\nO gráfico apresentado na prova mostra os principais benefícios para as empresas em relação ao uso de redes sociais: Divulgação da sua marca (53,0%), Engajamento com a sua audiência (44,2%), Aumento de vendas e do número de clientes (38,1%), Aumento de tráfego no blog/site (35,0%), Outro (0,3%).\n\nTerceira edição da Social Media Trends (2019). Disponível em: https://cdn2.hubspot.net/hubfs/. Acesso em: 31 jul. 2021 (adaptado).\n\nConsiderando as informações apresentadas, avalie as afirmações a seguir.\n\nI. As redes sociais apresentam-se como oportunidades para a área de inteligência organizacional e competitiva, demandando uma nova arquitetura de informação nas organizações.\nII. A interação dinâmica dos usuários pelas redes sociais fornece subsídios não apenas de consumidores, mas também de colaboradores e pode ser utilizada para análise e tomada de decisão.\nIII. A adoção de redes sociais pelas empresas demonstra a sua capacidade técnica para adotar esses dados no planejamento estratégico e na arquitetura da informação.\nIV. A inteligência organizacional e competitiva está baseada na capacidade de as organizações monitorarem e analisarem as informações para que se adaptem e se desenvolvam de forma sustentável.\n\nÉ correto apenas o que se afirma em:","alt":["I e IV.","II e III.","III e IV.","I, II e III.","I, II e IV."],"correct":"E","anulada":false,"exp":"Redes sociais realmente demandam nova arquitetura de informação para inteligência competitiva (I), fornecem dados de consumidores e colaboradores úteis à tomada de decisão (II), e a inteligência organizacional depende de monitorar e analisar essas informações para adaptação sustentável (IV); já a simples adoção de redes sociais não comprova, por si só, capacidade técnica de uso estratégico desses dados (III falsa)."},{"id":"2021-11","ano":2021,"n":11,"area":"Hardware / Arquitetura e Sistemas Operacionais","enunciado":"Uma empresa deseja se reposicionar no mercado e, para isso, precisa ampliar sua capacidade de atendimento em serviços computacionais. Atualmente, os sistemas infraestruturais e de informação rodam sobre Sistemas Operacionais de diversas versões e distribuições, tanto na plataforma Windows, quanto na plataforma Linux. Uma consultoria especializada propôs a migração do parque de servidores físicos para servidores virtuais, adotando-se o tipo II, ou seja, os Monitores de Máquina Virtual serão executados como processos dos Sistemas Operacionais hospedeiros, mantendo-se, a princípio, os Sistemas Operacionais do parque original como visitantes e adotando-se um único Sistema Operacional como hospedeiro.\n\nSobre o modelo proposto pela consultoria, avalie as afirmações a seguir.\n\nI. Os Sistemas Operacionais visitantes serão infectados se algum malware se instalar no Sistema Operacional hospedeiro.\nII. A empresa, após a virtualização, economizará recursos financeiros na aquisição de servidores e obterá mais eficiência no consumo de recursos.\nIII. A empresa não poderá manter a mesma estrutura de Sistemas Operacionais físicos no sistema virtualizado do tipo II.\nIV. A recuperação do Sistema Operacional virtual é mais simples e rápida, quando comparada ao sistema físico.\n\nÉ correto apenas o que se afirma em:","alt":["I e III.","II e III.","II e IV.","I, II e IV.","I, III e IV."],"correct":"C","anulada":false,"exp":"Em um hypervisor tipo II, o hospedeiro roda sobre um sistema operacional comum, portanto um malware nesse SO hospedeiro pode comprometer os SOs visitantes (I verdadeira); a virtualização de fato reduz custos de hardware e aumenta a eficiência de uso dos recursos (II verdadeira); a estrutura de SOs físicos originais é justamente preservada como visitantes nesse modelo, não descartada (III falsa); e restaurar uma máquina virtual costuma ser mais simples e rápido que recuperar um servidor físico (IV verdadeira)."},{"id":"2021-12","ano":2021,"n":12,"area":"Banco de Dados","enunciado":"A segurança dos dados refere-se às medidas que garantem confidencialidade, integridade e disponibilidade dos sistemas de informação e dos dados neles armazenados. É importante compreender que a segurança dos dados exige uma abordagem ampla em toda a empresa. Com base no exposto, não é possível proteger os dados se eles não forem resguardados por todos os processos que os circundam. A segurança dos dados depende de fatores como arquitetura dos sistemas, sistemas de hardware e software, rede e seus dispositivos, como também de pessoas internas e externas à organização.\n\nROB, P.; CORONEL, C. Sistemas de banco de dados: projeto, implementação e gerenciamento. São Paulo: Cengage Learning, 2011, p. 652 (adaptado).\n\nConsiderando a segurança em bancos de dados, avalie as asserções a seguir e a relação proposta entre elas.\n\nI. A confidencialidade dos dados é o que garante que eles estejam protegidos contra acesso não autorizado e, em caso de acesso autorizado, que sejam utilizados apenas para a finalidade designada.\n\nPORQUE\n\nII. As permissões de acesso às informações contidas nos bancos de dados dependem também da disponibilidade de acesso aos dados, sempre que solicitado por usuários autorizados para finalidades autorizadas.\n\nA respeito dessas asserções, assinale a opção correta.","alt":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é proposição verdadeira, e a II é uma proposição falsa.","A asserção I é proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"correct":"B","anulada":false,"exp":"A confidencialidade de fato protege contra acesso não autorizado e restringe o uso à finalidade designada (I verdadeira); porém a disponibilidade é um princípio distinto e complementar, não uma justificativa da confidencialidade — por isso II, embora verdadeira, não justifica corretamente a I."},{"id":"2021-13","ano":2021,"n":13,"area":"Engenharia de Software","enunciado":"A qualidade do processo de desenvolvimento de software incide de forma direta sobre a qualidade do produto a ser entregue. Ressalta-se que a elaboração do software demanda a execução de um projeto. Com isso, o processo de desenvolvimento de software envolve criatividade e nesse contexto, as habilidades e a experiência de cada desenvolvedor influenciam significativamente os resultados. Além disso, fatores externos, tais como novas tecnologias ou pressões para a antecipação de prazo para liberação de um release também podem interferir na qualidade do produto, independente do processo de software utilizado.\n\nSOMMERVILLE, I. Engenharia de Software. 8. ed. São Paulo: Pearson, 2007, p. 425 (adaptado).\n\nConsiderando o contexto da qualidade de processo e de produto de software, avalie as afirmações a seguir.\n\nI. O gerenciamento de qualidade de processo e seu contínuo aprimoramento contribuem para a produção de um software com poucos defeitos.\nII. A definição de padrões de processo, determinando os parâmetros para a realização das revisões de software, são fundamentais para gerenciar a qualidade do processo de software.\nIII. O monitoramento do processo de desenvolvimento de software é essencial para garantir que os padrões adotados estejam sendo devidamente seguidos.\nIV. O gerente de projetos deve definir processos que estabeleçam meios para atingir a qualidade de software, além de criar ou adotar métricas que permitam à organização avaliar se o software possui o nível de qualidade necessário.\n\nÉ correto apenas o que se afirma em:","alt":["I e III.","I e IV.","II e IV.","I, II e III.","II, III e IV."],"correct":"D","anulada":false,"exp":"O gerenciamento contínuo da qualidade do processo reduz defeitos (I); padrões de processo bem definidos e revisados são fundamentais para a qualidade (II); o monitoramento garante aderência aos padrões adotados (III); e cabe ao gerente de projetos estabelecer processos e métricas de qualidade (IV) — as quatro afirmações são coerentes com os princípios de engenharia de software."},{"id":"2021-14","ano":2021,"n":14,"area":"Engenharia de Software","enunciado":"Projetado para ser compreensível, acessível, flexível e integrado a outras abordagens, como a ágil, o modelo Capability Maturity Model Integration CMMI-Dev (Desenvolvimento) ajuda as organizações a entender seu nível atual de capacidade e desempenho, oferecendo um guia para otimizar os resultados dos negócios.\n\nDisponível em: https://cmmiinstitute.com/cmmi/intro. Acesso em: 27 jun. 2020 (adaptado).\n\nO modelo MPS para software (MPS-SW) tem como base os requisitos de processos definidos nos modelos de melhoria de processo e atende à necessidade de implantar os princípios de engenharia de software de forma adequada ao contexto das empresas, estando em conformidade com as principais abordagens internacionais para definição, avaliação e melhoria de processos de software.\n\nDisponível em: http://softex.br/mpsbr/modelos/#mpssw. Acesso em: 27 jun. 2020 (adaptado).\n\nEm relação aos modelos CMMI-Dev e MPS-SW, avalie as afirmações a seguir.\n\nI. Os dois modelos são organizados em chamados níveis de maturidade, porém a quantidade de níveis no modelo MPS-SW é maior do que a apresentada no CMMI-Dev.\nII. Os dois modelos levam em consideração a Engenharia de Software para a implementação dos processos em todos os níveis, sem a necessidade de alinhamento com o planejamento estratégico da empresa.\nIII. Quanto maior o nível de maturidade de uma organização, mais avançada é sua orientação estratégica e sua capacidade de aplicação dos processos relacionados, o que possivelmente implica melhores resultados.\n\nÉ correto o que se afirma em:","alt":["I, apenas.","II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"correct":"C","anulada":false,"exp":"O MPS-SW possui mais níveis de maturidade que o CMMI-Dev (I verdadeira); e em ambos os modelos, quanto maior o nível de maturidade, maior a orientação estratégica e a capacidade de aplicação dos processos, geralmente implicando melhores resultados (III verdadeira). Já a implementação dos processos não dispensa alinhamento com o planejamento estratégico da empresa, tornando II falsa."},{"id":"2021-15","ano":2021,"n":15,"area":"Engenharia de Software","enunciado":"Os projetos são um esforço temporário empreendido para criar um produto, serviço ou resultado único.\n\nPMI. Guia PMBOK: Um Guia para o Conjunto de Conhecimentos em Gerenciamento de Projetos. 6. ed. Pennsylvania: PMI, 2017 (adaptado).\n\nCom base na definição de projetos apresentada, avalie as afirmações a seguir.\n\nI. A criação de um produto único, ou um item do produto, pode representar um possível projeto.\nII. Um serviço único, ou uma capacidade de realizar um serviço, pode representar um possível projeto.\nIII. A operação de um software, mesmo que repetidas vezes, pode representar um possível projeto.\nIV. Uma combinação única de um ou mais produtos, serviços ou resultados, pode representar um possível projeto.\n\nÉ correto apenas o que se afirma em:","alt":["I e III.","II e III.","II e IV.","I, II e IV.","I, III e IV."],"correct":"D","anulada":false,"exp":"Segundo o PMBOK, um projeto é um esforço temporário para criar um produto, serviço ou resultado único — logo, criar um produto (I), um serviço (II) ou uma combinação destes (IV) pode caracterizar um projeto; já a OPERAÇÃO repetida de um software é trabalho contínuo/rotina, faltando o caráter temporário e único exigido para ser um projeto (III falsa)."},{"id":"2021-16","ano":2021,"n":16,"area":"Redes de Computadores","enunciado":"A computação em nuvem é caracterizada por um conjunto de recursos virtualizados e disponibilizados via internet. Os recursos podem ser configurados dinamicamente, fornecendo a base para a escalabilidade sob demanda. O vínculo com a computação em nuvem geralmente se baseia em um modelo de pagamento por uso, no qual as garantias são oferecidas por meio de SLAs (acordos de nível de serviço) personalizados. Os provedores de computação em nuvem oferecem essas camadas aos clientes por meio de várias interfaces (incluindo ferramentas de linha de comando, ambientes de programação e interfaces Web), levando a três tipos diferentes de serviços: Infraestrutura como Serviço (IaaS); Plataforma como Serviço (PaaS); Software como Serviço (SaaS).\n\nVAQUERO, L. M. et al. A Break in the Clouds: Towards a Cloud Definition. ACM SIGCOMM Computer Communication Review, 2009 (adaptado).\n\nConsiderando as informações apresentadas, avalie as afirmações a seguir.\n\nI. O uso do IaaS é recomendado para pequenas e médias empresas cujo crescimento da infraestrutura não acompanha sua expansão, bem como para empresas que possuem demandas oscilantes, como lojas virtuais.\nII. O uso de IaaS e SaaS não é recomendado quando há restrições legais quanto ao armazenamento ou terceirização dos dados, como ocorre muitas vezes em empresas e autarquias públicas.\nIII. O uso de SaaS é recomendado para grandes empresas que estão dispostas a investir em grande escala na compra de licenças.\nIV. O uso de PaaS não é indicado para empresas que possuem um time próprio de desenvolvedores.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","I e III.","III e IV.","I, II e IV.","II, III e IV."],"correct":"A","anulada":false,"exp":"IaaS é indicado para empresas com demanda de infraestrutura oscilante, como lojas virtuais que crescem de forma imprevisível (I verdadeira); IaaS e SaaS de fato podem esbarrar em restrições legais quando envolvem armazenar ou terceirizar dados fora da empresa, como em órgãos públicos (II verdadeira). SaaS não exige investimento em licenças em grande escala — é justamente um modelo de pagamento por uso (III falsa); e PaaS pode ser útil mesmo para times próprios de desenvolvedores, acelerando o desenvolvimento (IV falsa)."},{"id":"2021-17","ano":2021,"n":17,"area":"Redes de Computadores","enunciado":"O funcionamento da internet está baseado no roteamento de pacotes do tipo IP (Internet Protocol).\n\nCom relação a este protocolo e aos equipamentos utilizados para roteá-lo, avalie as afirmações a seguir.\n\nI. Um pacote IPv4 pode ficar em loop indefinidamente, caso haja erros nas tabelas de roteamentos dos roteadores.\nII. Em uma intranet com mais de um roteador, o sequenciamento de pacotes IPv4 é garantido por meio do campo TTL.\nIII. Um pacote IPv4 pode ser fragmentado por qualquer dispositivo na rede, se o tamanho máximo de MTU da rede onde os pacotes vão transitar for menor que o tamanho do pacote a ser transmitido.\nIV. Ao enviar um pacote IPv4, a máscara de sub-rede é utilizada pelo computador ou roteador para identificar se o computador de destino pertence a esta mesma sub-rede.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","I e III.","III e IV.","I, II e IV.","II, III e IV."],"correct":"C","anulada":false,"exp":"A fragmentação de pacotes IPv4 realmente ocorre quando o MTU da rede é menor que o tamanho do pacote a transmitir (III verdadeira); a máscara de sub-rede é usada para identificar se o destino pertence à mesma sub-rede (IV verdadeira). Já um pacote IPv4 mal roteado pode, sim, entrar em loop, mas o TTL existe justamente para evitar loops indefinidos, tornando I uma leitura imprecisa do papel do TTL, e o campo TTL não garante sequenciamento de pacotes — esse é papel de camadas superiores como o TCP (II falsa)."},{"id":"2021-18","ano":2021,"n":18,"area":"Engenharia de Software","enunciado":"A versão por estágios do Modelo Integrado de Maturidade em Capacitação (CMMI - Capability Maturity Model Integration) permite que o desenvolvimento de sistemas e processos de gerenciamento de uma organização seja avaliado e que a ele seja atribuído um nível de maturidade.\n\nSOMMERVILLE, I. Engenharia de Software. 9. ed. São Paulo: Pearson Prentice Hall, 2011 (adaptado).\n\nConsiderando a informação apresentada, suponha que uma determinada organização tenha processos de gerenciamento bem caracterizados, descritos por padrões, além de utilizar ferramentas e métodos estabelecidos.\n\nDe acordo com a versão por estágios do CMMI, esta organização possui os requisitos mínimos necessários para atingir qual nível de maturidade?","alt":["Inicial.","Definido.","Gerenciado.","Em otimização.","Gerenciado quantitativamente."],"correct":"B","anulada":false,"exp":"Ter processos de gerenciamento bem caracterizados, descritos por padrões e apoiados por ferramentas e métodos estabelecidos corresponde ao nível 'Definido' do CMMI por estágios — acima do nível Gerenciado, no qual os processos existem mas ainda não estão padronizados em toda a organização."},{"id":"2021-19","ano":2021,"n":19,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"O gerenciamento de serviços de TI tem como objetivo a entrega e o suporte de serviços de TI focados nas necessidades dos clientes e alinhados à estratégia de negócio da organização. Esta visa alcançar custos e desempenho desejados pelo cliente, por meio de acordos de nível de serviço estabelecidos internamente entre a área de TI e as demais áreas envolvidas na cadeia do serviço.\n\nMAGALHÃES, L. et al. Gerenciamento de Serviços de TI na Prática: Uma abordagem com base na ITIL. São Paulo: Novatec, 2007 (adaptado).\n\nA partir das informações do texto, avalie as asserções a seguir e a relação proposta entre elas.\n\nI. O acordo de nível de serviço é um contrato firmado entre o provedor de serviços de TI e seus clientes, que incluem detalhes de quais serviços serão fornecidos.\n\nPORQUE\n\nII. Os serviços devem ser monitorados quanto ao desempenho e disponibilidade no nível em que for acordado entre as partes.\n\nA respeito dessas asserções, assinale a opção correta.","alt":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"correct":"A","anulada":false,"exp":"O SLA é de fato um contrato entre o provedor de serviços de TI e o cliente, detalhando quais serviços serão fornecidos (I verdadeira); e o monitoramento de desempenho e disponibilidade conforme o nível acordado é justamente a forma de garantir o cumprimento desse contrato (II verdadeira, e justifica corretamente a I)."},{"id":"2021-20","ano":2021,"n":20,"area":"Lógica e Programação","enunciado":"O paradigma de programação em lógica constitui-se como um processo de definição de relações em que se constroem fatos e regras sobre os elementos e suas relações. A ativação dos programas acontece por meio de consultas (ou perguntas) sobre o relacionamento definido. Ao construir-se um banco de dados referente a uma família, inicia-se pelas relações de parentesco, tais como:\n\npai(joão,maria) — convencionado que joão é pai de maria\nmãe(maria,luiz) — convencionado que maria é mãe de luiz\n\nAs cláusulas, sem condições, definem os fatos sobre o domínio do problema. De outra maneira, é possível definir as regras que são cláusulas com condições:\n\navô_materno(joão,luiz) :- pai(joão,maria), mãe(maria,luiz)\n\nNesse contexto, avalie as afirmações a seguir.\n\nI. A consulta mãe(maria, X) retorna verdadeiro conforme identificado na cláusula.\nII. A conclusão \"joão é avô materno de luiz\" é identificada como cabeça da cláusula.\nIII. A regra irmão(X,Y) :- pai(Z,X), pai(Z,Y) é uma regra genérica que define irmãos por parte de pai.\nIV. A regra avô_materno(X,Y) :- pai(Z,X), mãe(Y,Z) é uma regra genérica para o programa.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","II e III.","III e IV.","I, II e IV.","I, III e IV."],"correct":"B","anulada":false,"exp":"A consulta mãe(maria, X) realmente retorna verdadeiro com X=luiz, conforme o fato definido (I verdadeira); e a conclusão 'joão é avô materno de luiz' corresponde exatamente à cabeça da cláusula regra (II verdadeira). Já a regra de irmãos do item III não evita que X e Y sejam a mesma pessoa, e a regra do item IV inverte incorretamente a ordem dos argumentos do predicado mãe."},{"id":"2021-21","ano":2021,"n":21,"area":"Engenharia de Software","enunciado":"A gerência de projetos é utilizada por diversas áreas e atualmente se faz presente também em várias frentes da computação, como no desenvolvimento e implantação de softwares e hardwares. O gerente de projetos desenvolve um papel fundamental na condução de um projeto, resolvendo conflitos, administrando interesses das partes e acompanhando a evolução do projeto.\n\nPMI. Guia PMBOK: Um Guia para o Conjunto de Conhecimentos em Gerenciamento de Projetos. 6. ed. Pennsylvania: PMI, 2017 (adaptado).\n\nCom base no texto apresentado, avalie as afirmações a seguir.\n\nI. O termo de abertura do projeto define, além das partes interessadas, os limites do projeto e do orçamento, quando necessário.\nII. Na Estrutura Analítica do Projeto (EAP), o gerente de projetos define os pacotes de entregas bem como a responsabilidade pelas mesmas.\nIII. É papel do gerente de projetos trocar membros da equipe de projeto, caso seja necessário, para garantir o andamento do projeto e prazos de entrega.\nIV. Após a separação do projeto em pacotes de entregáveis, é criada a matriz de responsabilidade, por meio da qual os integrantes do projeto são separados de acordo com os entregáveis e respectivos prazos.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","II e IV.","III e IV.","I, II e III.","I, III e IV."],"correct":"C","anulada":false,"exp":"Cabe ao gerente de projetos remanejar membros da equipe quando necessário para manter o andamento e os prazos (III verdadeira), e a matriz de responsabilidade é construída a partir dos pacotes de entrega definidos na EAP, associando entregáveis a responsáveis e prazos (IV verdadeira). Já o termo de abertura não detalha limites orçamentários com esse nível de precisão, e a definição de pacotes de entrega na EAP costuma ser responsabilidade compartilhada da equipe, não apenas do gerente."},{"id":"2021-22","ano":2021,"n":22,"area":"Banco de Dados","enunciado":"Dado o controle de estoques de uma empresa de produção e embarque de peças, observe a descrição do esquema relacional abaixo para as tabelas Peça, Fornecedor e Embarque.\n\nPeça(CodPeça, NomePeça, CorPeça, PesoPeça)\nFornecedor(CodFornecedor, NomeFornecedor, StatusFornecedor)\nEmbarque(CodPeça, CodFornecedor, QuantidadeEmbarque), tal que CodPeça referencia Peça e CodFornecedor referencia Fornecedor.\n\nConsidere que os atributos sublinhados no esquema relacional representam as chaves primárias das tabelas. Considere, ainda, que é necessário executar um comando Structured Query Language (SQL) que recupere todas as tuplas na base de dados (CodPeça, NomePeça) que possuem a quantidade de peças embarcadas maior do que 100.\n\nCom base nessas informações, avalie os comandos a seguir.\n\nI. SELECT Embarque.CodPeça, Peça.NomePeça FROM Peça WHERE CodPeça IN (SELECT Embarque.CodPeça FROM Embarque WHERE Embarque.QuantidadeEmbarque > 100);\nII. SELECT Peça.CodPeça, Peça.NomePeça FROM Peça, Embarque WHERE Peça.CodPeça = Embarque.CodPeça AND Embarque.QuantidadeEmbarque > 100;\nIII. SELECT P.CodPeça, P.NomePeça FROM Peça P JOIN Embarque E ON P.CodPeça = E.CodPeça AND E.QuantidadeEmbarque > 100;\nIV. SELECT CodPeça, NomePeça FROM Peça JOIN Embarque ON Peça.CodPeça = Embarque.CodPeça AND Embarque.QuantidadeEmbarque > 100;\n\nSão comandos SQL que promovem a recuperação da informação apenas os descritos em:","alt":["I e II.","I e IV.","II e III.","I, III e IV.","II, III e IV."],"correct":"E","anulada":false,"exp":"A alternativa I referencia 'Embarque.CodPeça' na cláusula SELECT sem incluir a tabela Embarque no FROM principal (que contém apenas Peça) — isso gera erro de referência inválida. Já as opções II (junção implícita), III (JOIN com alias) e IV (JOIN direto) recuperam corretamente as peças com mais de 100 unidades embarcadas."},{"id":"2021-23","ano":2021,"n":23,"area":"Banco de Dados","enunciado":"É possível recuperar conjuntos de dados de forma organizada e que façam sentido para gerar informações. Nesse contexto, a recuperação de informações gravadas nos bancos de dados ocorre por meio de consultas SQL - Structured Query Language (linguagem de consulta de dados estruturados).\n\nConsidere o seguinte conjunto de tabelas de banco de dados:\n\nMotorista (idmoto, nome, telefone, idade): 22-José-8888-0000-45; 29-Maria-9999-0000-33; 31-Antônio-Null-35; 32-Carlos-3333-9999-16; 58-Josefina-3333-0000-60; 64-Marilda-3333-1111-26.\n\nCarro (idcarro, nomecarro, cor): 101-Ônix-Vermelho; 102-Gol-Vermelho; 103-Civic-Verde; 104-Pálio-Azul.\n\nReservas (idmoto, idcarro, dia): 22-101-07/08/2020; 22-102-07/08/2020; 22-103-09/08/2020; 22-104-10/08/2020; 31-102-10/08/2020; 31-103-11/08/2020; 64-101-13/08/2020.\n\nCom base nas informações apresentadas, qual das seguintes consultas traria o nome dos motoristas que reservaram os carros vermelhos?","alt":["SELECT M.NOME FROM MOTORISTA M WHERE M.IDMOTO IN (SELECT R.IDMOTO FROM RESERVAS R WHERE R.IDCARRO NOT IN (SELECT C.IDCARRO FROM CARRO C WHERE C.COR = 'Vermelho'))","SELECT M.NOME FROM MOTORISTA M WHERE M.IDMOTO IN (SELECT R.IDMOTO FROM RESERVAS R WHERE R.IDCARRO IN (SELECT C.IDCARRO FROM CARRO C WHERE C.COR = 'Vermelho'))","SELECT M.NOME FROM MOTORISTA M WHERE M.IDMOTO IN (SELECT R.IDMOTO FROM RESERVAS R WHERE R.IDCARRO NOT IN (SELECT C.IDCARRO FROM CARRO C WHERE C.COR = 'Vermelho')) [variante repetida na prova]","SELECT M.NOME FROM MOTORISTA M WHERE M.IDMOTO NOT IN (SELECT R.IDMOTO FROM RESERVAS R WHERE R.IDCARRO NOT IN (SELECT C.IDCARRO FROM CARRO C WHERE C.COR = 'Vermelho'))","SELECT M.NOME FROM MARINHEIROS M WHERE M.IDMARI NOT IN (SELECT R.IDMARI FROM RESERVAS R WHERE R.IDBARCO ANY (SELECT B.IDBARCO FROM BARCO B WHERE B.COR = 'Vermelho')) [alternativa com tabelas inexistentes no enunciado]"],"correct":"B","anulada":false,"exp":"A subconsulta mais interna filtra os carros vermelhos; a subconsulta intermediária deve usar IN (não NOT IN) para selecionar as reservas desses carros; e a consulta externa usa IN para retornar os motoristas que fizeram essas reservas — a alternativa B aplica IN corretamente nas duas camadas de filtro, sem negações indevidas."},{"id":"2021-24","ano":2021,"n":24,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"A pesquisa operacional é tanto ciência quanto arte. Ciência por causa das técnicas matemáticas envolvidas (objetivo) e arte porque o sucesso das fases que precedem e sucedem a solução do modelo matemático depende muito da criatividade e experiência dos profissionais de pesquisa operacional (subjetivo).\n\nARENALES, M. et al. Pesquisa Operacional. Rio de Janeiro: Elsevier, 2011, p. 5 (adaptado).\n\nSuponha que uma empresa de montagem de computadores fabrica três tipos básicos de dispositivos: desktops, notebooks e netbooks. A produção da empresa ocorre em suas duas fábricas, uma na zona franca de Manaus e outra na região Sul do país. De acordo com a última venda realizada, a empresa precisa entregar 16 mil desktops, 6 mil notebooks e 28 mil netbooks. A fábrica de Manaus tem custo de produção diário de R$150.000,00 para produção de 8 mil desktops, mil notebooks e 2 mil netbooks. O custo de produção diário da fábrica da região Sul é de R$210.000,00 para a produção de 2 mil desktops, mil notebooks e 7 mil netbooks.\n\nConsiderando as informações apresentadas, escolha o modelo que representa a situação descrita e determina a quantidade de dias que cada uma das fábricas deverá operar para atender à demanda do pedido ao menor custo.","alt":["Min Z = 150.000x + 210.000y; sujeito a: 8x+2y ≤ 16; x+y ≤ 6; 2x+7y ≤ 28","Min Z = 150.000x + 210.000y; sujeito a: 8x+2y ≥ 16; x+y ≥ 6; 2x+7y ≥ 28","Min Z = 150.000x + 210.000y; sujeito a: 8x+2y = 16; x+y = 6; 2x+7y ≥ 28","Min Z = 150.000x + 210.000y; sujeito a: 8x-2y ≤ 16; x-y ≤ 6; 2x-7y ≤ 28","Min Z = 150.000x + 210.000y; sujeito a: 8x-2y ≤ 16; x+y ≤ 6; 2x-7y ≤ 28"],"correct":"B","anulada":false,"exp":"O problema exige que a produção combinada atenda no mínimo a demanda (16 mil desktops, 6 mil notebooks, 28 mil netbooks) — por isso as restrições devem ser do tipo 'maior ou igual' (≥), garantindo que a soma da produção das duas fábricas cubra pelo menos essas quantidades ao menor custo possível."},{"id":"2021-25","ano":2021,"n":25,"area":"Redes de Computadores","enunciado":"Em conformidade com a ABNT NBR ISO/IEC 27002 (2013), segurança da informação envolve práticas e processos de proteção e salvaguarda dos ativos da informação e de tecnologias da informação. Está amparada pelos preceitos de integridade, disponibilidade e confidencialidade. Segurança da informação também pode ser entendida como uma área do conhecimento dedicada à proteção de ativos da informação contra acessos não autorizados e alterações indevidas. Além disso, ela aborda a proteção da informação contra vários tipos de ameaças, implicando na possível continuidade do negócio, na minimização do risco e na maximização do retorno sobre os investimentos e oportunidades.\n\nASSOCIAÇÃO BRASILEIRA DE NORMAS TÉCNICAS. ABNT NBR ISO/IEC 27002. Rio de Janeiro: ABNT, 2013 (adaptado).\n\nConsiderando o texto apresentado, avalie as afirmações a seguir.\n\nI. A integridade da informação tem como objetivo garantir a acessibilidade da informação.\nII. A disponibilidade garante que os autorizados a acessarem a informação possam fazê-lo sempre que necessário.\nIII. A confidencialidade da informação é a garantia de que somente pessoas autorizadas terão acesso a ela, protegendo-a de acordo com o grau de sigilo do seu conteúdo.\nIV. A legalidade é a garantia de que a informação foi produzida em conformidade com a lei.\nV. A autenticidade é a garantia de que em um processo de comunicação os remetentes sejam exatamente quem dizem ser.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","I e IV.","II, III e V.","I, III, IV e V.","II, III, IV e V."],"correct":"E","anulada":false,"exp":"A integridade garante que a informação não seja alterada indevidamente — não 'acessibilidade', que é outro conceito, tornando I falsa; disponibilidade (II), confidencialidade (III), legalidade (IV) e autenticidade (V) estão corretamente descritas conforme a norma ABNT NBR ISO/IEC 27002."},{"id":"2021-26","ano":2021,"n":26,"area":"Banco de Dados","enunciado":"A expressão Big Data refere-se a um conjunto de técnicas e ferramentas para o armazenamento e manipulação de conjuntos de dados muito grandes. Tecnologias tradicionais, como bancos de dados relacionais e ferramentas de processamento sequencial, não suportam o vasto volume de dados. O Big Data possui quatro características marcantes: volume, variedade, velocidade e veracidade.\n\nDisponível em: https://sol.sbc.org.br/livros/index.php/sbc/catalog/. Acesso em: 13 jun. 2020 (adaptado).\n\nConsiderando as informações apresentadas e o conjunto de características marcantes do Big Data, avalie as afirmações a seguir.\n\nI. Em relação ao volume, a quantidade de dados gerados e coletados em diversos tipos de aplicações está aumentando exponencialmente, e as ferramentas de Big Data devem ser capazes de lidar apropriadamente com esse desafio.\nII. No que diz respeito à variedade, os dados podem ser coletados de diferentes fontes e com diferentes formatos e estruturas e se dividem em dados estruturados, como os dados dos cidadãos; dados semiestruturados, como os dados de sensores; e dados não estruturados, como os de câmeras de vídeo de segurança.\nIII. Quanto à velocidade, o processamento de dados deve ocorrer em condições de alta latência, pois eles podem se tornar inúteis, como, por exemplo, dados coletados de sensores de veículos, a análise de redes sociais e as informações sobre o trânsito da cidade.\nIV. No que se refere à veracidade, como os dados são coletados de múltiplas fontes, é importante garantir sua qualidade, utilizando fontes confiáveis e consistentes, a fim de evitar erros e comprometer as análises.\n\nÉ correto apenas o que se afirma em:","alt":["I e IV.","II e III.","III e IV.","I, II e III.","I, II e IV."],"correct":"E","anulada":false,"exp":"As características do Big Data estão descritas corretamente: volume crescendo exponencialmente (I), variedade de fontes e formatos de dados (II), e veracidade exigindo fontes confiáveis para evitar erros de análise (IV). Já a característica de velocidade exige processamento em BAIXA latência (tempo real), e não em 'alta latência' como afirma o item III, tornando-o falso."},{"id":"2021-27","ano":2021,"n":27,"area":"Hardware / Arquitetura e Sistemas Operacionais","enunciado":"Suponha que um gestor de TI de determinada empresa está avaliando o desempenho de infraestrutura com o objetivo de evitar despesas desnecessárias em aumento de capacidade. Ele identifica que o servidor da base de dados do sistema mais solicitado realiza uma média de 4,5 operações de I/O por transação, sendo que cada I/O realizado no disco consome em média 20 ms. Em uma hora, ele observa que 7.200 transações foram executadas.\n\nCom base nas informações apresentadas, o gestor concluiu que o throughput médio do disco (em transações por segundo) e a utilização média do disco (em valor percentual) são, respectivamente:","alt":["2 e 1,8.","2 e 18.","9 e 2.","9 e 18.","15 e 9."],"correct":"D","anulada":false,"exp":"Throughput = transações por segundo = 7.200 ÷ 3.600 = 2 tps. Cada transação gera 4,5 operações de I/O de 20ms cada, totalizando 90ms de disco por transação; com 2 transações por segundo, a utilização do disco é 2 × 90ms = 180ms por segundo, ou seja, 18%."},{"id":"2021-28","ano":2021,"n":28,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"A Governança de Tecnologia da Informação pode auxiliar nos processos estratégicos das organizações, alinhando controles da TI, como segurança da informação e integração tecnológica, com controles de gestão, como marco de regulação e ambiente de negócio, conforme ilustra a figura a seguir (Figura I — Fatores motivadores da Governança de Tecnologia da Informação (TI): TI como prestadora de serviços, Integração Tecnológica, Ambientes de negócios, Marcos de regulação, Segurança da informação).\n\nFERNANDES, A. A.; ABREU, V. F. Implantando a Governança de TI: da Estratégia à Gestão de Processos e Serviço. Rio de Janeiro: Brasport, 2014 (adaptado).\n\nConsiderando o texto e a figura apresentados, assinale a opção correta.","alt":["A segurança da informação é definida pela Política da Segurança da Informação, não levando em conta cargos e salários.","A TI como prestadora de serviços representa os profissionais de informática, não levando em conta hardware e software.","A integração tecnológica é definida pela integração entre hardware e software, não levando em conta seus fabricantes.","Os marcos de regulação são definidos pelos conselhos das organizações, não levando em conta as regulações políticas.","O ambiente de negócio é definido por clientes mais exigentes e conscientes, não levando em conta as políticas internas."],"correct":"A","anulada":false,"exp":"Entre os fatores motivadores da Governança de TI, a segurança da informação é formalizada por meio de uma política de segurança da informação — que trata de controles de acesso e proteção de dados, e não de questões de cargos e salários, que pertencem à área de gestão de pessoas."},{"id":"2021-29","ano":2021,"n":29,"area":"Banco de Dados","enunciado":"Suponha que, como projetista de dados, você precisa desenvolver um sistema para uma clínica médica. Após consultar todos os envolvidos, foi proposto o modelo de entidades e relacionamentos apresentado na prova, envolvendo as entidades ESPECIALIDADE, MEDICO, FUNCIONARIO, CONSULTA, CONVENIO, PACIENTE e DEPENDENTE, com os relacionamentos \"Atua na\" (Médico-Especialidade), \"Atende\" (Médico-Consulta / Funcionário-Consulta), \"Depende de\" (Dependente-Paciente), \"Possui\" (Paciente-Convênio), entre outros, com as respectivas cardinalidades (1,N), (1,1), (0,N) e (0,1) indicadas no diagrama.\n\nAlves, W. P. Banco de dados. São Paulo: Érica, 2014.\n\nConsiderando esse contexto e o modelo de entidades e relacionamentos proposto, avalie as afirmações a seguir.\n\nI. A restrição de participação da entidade MÉDICO é total, pois um médico precisa atuar em pelo menos uma área da medicina; com relação à ESPECIALIDADE, a restrição é parcial, pois pode haver especialidade sem nenhum médico associado.\nII. A restrição de participação de PACIENTE é parcial, pois não é obrigatório o PACIENTE ter dependentes; já para DEPENDENTE a restrição é total, uma vez que é preciso ter um responsável (PACIENTE) cadastrado no banco de dados.\nIII. A restrição de participação de PACIENTE é parcial, já que se pode ter o cadastro do paciente no banco de dados sem ter consulta marcada; já para CONSULTA a restrição é total, uma vez que uma consulta somente pode ser agendada para um paciente cadastrado.\nIV. A razão da cardinalidade é 1:N, pois um paciente pode marcar várias consultas, em dias e horários diferentes, e a consulta (em data e horário específicos) pode ser agendada para vários pacientes.\n\nÉ correto apenas o que se afirma em:","alt":["I e III.","II e IV.","III e IV.","I, II e III.","I, II e IV."],"correct":"D","anulada":false,"exp":"Um médico deve atuar em pelo menos uma especialidade, mas uma especialidade pode existir sem médico associado — participação total de Médico e parcial de Especialidade (I verdadeira); um paciente pode não ter consulta marcada, mas toda consulta exige um paciente cadastrado — participação parcial de Paciente e total de Consulta (III verdadeira); e a razão de cardinalidade entre Paciente e Consulta é 1:N, pois um paciente pode ter várias consultas em datas/horários diferentes (IV verdadeira)."},{"id":"2021-30","ano":2021,"n":30,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"Um Sistema de Informação Gerencial (SIG) representa um conjunto de recursos dentre os quais é possível citar os sistemas: de apoio à decisão, de especialistas, de informação executiva, de gestão de pessoas e de gestão de projetos, os quais permitem que a instituição funcione de forma eficiente. Os sistemas especialistas são sistemas inteligentes que armazenam e processam o conhecimento adquirido de profissionais especializados em uma determinada área do conhecimento.\n\nSPIRLANDELLI, L. P. et al. Sistemas especialistas: um estudo de caso com o EXPERT SINTA. Revista Eletrônica de Sistema de Informação e Gestão Tecnológica. Franca, v. 1, n. 1, p. 1-16, 2011 (adaptado).\n\nConsiderando o uso de um componente para um sistema especialista voltado para diagnósticos médicos, assinale a opção correta.","alt":["Base de conhecimento é o componente que mantém os axiomas gramaticais e léxicos definidos pelos especialistas.","Base de informações estratégicas é o componente que possui as técnicas de navegação nas bases de conhecimento.","Base de regras é o componente que traduz todas as informações externas que estejam em interação com o sistema especialista.","Analisador semântico é o componente que obtém e armazena informações sobre diagnósticos por meio de um reconhecimento de regras gramaticais.","Motor de inferência é o componente que possui um conjunto de heurísticas adotadas para a resolução de problemas na execução das tarefas."],"correct":"E","anulada":false,"exp":"O motor de inferência é o componente do sistema especialista responsável por aplicar as heurísticas e regras armazenadas na base de conhecimento para resolver problemas e gerar diagnósticos — diferente da base de conhecimento, que apenas armazena o saber especializado, sem processá-lo."},{"id":"2021-31","ano":2021,"n":31,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"Uma das finalidades da Governança de Tecnologia da Informação (TI) é monitorar o cumprimento das regras de negócio estabelecidas por meio da estruturação de um catálogo de serviços, o qual possibilita que os serviços prestados pela gestão da TI sejam conhecidos por todos. A Governança de TI descreve como as pessoas envolvidas em governança em uma organização deverão considerar a TI no monitoramento, controle e supervisão de suas funções precípuas. Nessas condições, é reconhecido que a implantação ágil da Governança de TI passa pela utilização de modelos de referência, os quais propiciam uma governança assertiva.\n\nMORAES, E. A. P.; MARIANO, S. R. H. M. Uma releitura dos principais modelos de governança de tecnologia da informação. Revista das Faculdades Integradas Vianna Júnior. Juiz de Fora, v. 1, n. 1, p. 201-217, 2010 (adaptado).\n\nEm geral, os modelos de referências (ou frameworks) de governança de TI são prescritivos, diferenciando-se pelo tipo de enfoque e pelo nível de cobertura que oferecem à organização de TI.\n\nNesse contexto, avalie em quais modelos a instância de governança de TI define o modo como é feito o direcionamento, a avaliação e o monitoramento das instâncias de gestão de TI.\n\nI. Norma ISO/IEC 38500.\nII. CobiT (Control Objectives for Information and related Technology).\nIII. BSC (Balanced Scorecard).\nIV. CMMI (Capability Maturity Model Integration).\n\nSão modelos corretos apenas os apresentados em:","alt":["I e II.","I e IV.","II e III.","I, III e IV.","II, III e IV."],"correct":"A","anulada":false,"exp":"A norma ISO/IEC 38500 e o framework CobiT estruturam a governança de TI justamente em torno de direcionar, avaliar e monitorar a gestão de TI. Já o BSC é uma ferramenta de gestão estratégica organizacional geral (não específica de governança de TI), e o CMMI é um modelo de maturidade de processos de software, não de governança corporativa de TI."},{"id":"2021-32","ano":2021,"n":32,"area":"Engenharia de Software","enunciado":"No desenvolvimento do módulo de integração do sistema do SAMU com os sistemas de hospitais, um analista gerou um diagrama de sequência envolvendo os objetos SAMU, Regulação, API, hospitalA e hospitalB, com as mensagens: 1: solicitarLeito(); 2: procurarLeitos(); 3: verificarTodos(); 4: procurarVaga() [para hospitalA]; 5: procurarVaga() [para hospitalB]; 6/7: disponibilidade; 8: vagas disponíveis; 9: escolherLeito(hosp); 10: definirVaga() [para hospitalA]; 12: definirVaga() [para hospitalB]; 11/13: ok; 14: vaga definida; 15: vaga.\n\nCom relação ao diagrama apresentado, avalie as asserções a seguir e a relação proposta entre elas.\n\nI. As chamadas 4: procurarVaga() e 5: procurarVaga() são feitas simultaneamente (em paralelo) pela API para minimizar o tempo de espera da chamada 2: procurarLeitos().\n\nPORQUE\n\nII. As chamadas 10: definirVaga() e 12: definirVaga() são feitas simultaneamente (em paralelo), mas a espera do retorno é feita em sequência, o que aumentará o tempo de resposta.\n\nA respeito dessas asserções, assinale a opção correta.","alt":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"correct":"C","anulada":false,"exp":"As chamadas 4 e 5 (procurarVaga) de fato ocorrem em paralelo para acelerar a busca por vagas em múltiplos hospitais, reduzindo o tempo de resposta da chamada 2 (asserção I verdadeira). Já a asserção II afirma que a espera das chamadas 10 e 12 aumentaria o tempo de resposta mesmo sendo paralelas, o que não decorre logicamente da min descrição do diagrama — tornando a II uma proposição falsa."},{"id":"2021-33","ano":2021,"n":33,"area":"Lógica e Programação","enunciado":"Uma abordagem calcula a posição da chave na tabela com base no valor da chave. Este valor é a única indicação da posição. Quando a chave é conhecida, a posição na tabela pode ser acessada diretamente, sem fazer qualquer outro teste preliminar, conforme exigido na busca binária ou durante a pesquisa em uma árvore. Precisamos encontrar uma função h que possa transformar uma chave particular K — seja ela uma cadeia de caracteres, um número, um registro etc. — em um índice na tabela usada para armazenar itens do mesmo tipo que K. A função h é chamada função de escrutínio (hash) e não retorna valores únicos. Por exemplo, h(\"abc\") = h(\"acb\"). Este problema é chamado colisão.\n\nDROZDEK, A. Estrutura de Dados e Algoritmos em C++. São Paulo: Cengage do Brasil, p. 473, 2016 (adaptado).\n\nUma tabela na qual os dados são inseridos em entradas determinadas por uma função h, conforme descrito no texto, é chamada de tabela de dispersão ou tabela de espalhamento. A tabela de dispersão é representada por meio do vetor tabelaH de T posições, no qual cada posição é uma estrutura ItemDado, com campos Chave, Dado e Prox (ponteiro para o próximo item em caso de colisão, tratada por encadeamento). O valor -1 no campo chave indica entrada livre. A função h(chave) retorna o resto da divisão inteira de chave por T.\n\nConsiderando as informações apresentadas e supondo que T = 9, assinale a opção que corresponde ao estado de tabelaH após a seguinte sequência de chamadas: insere(13,6); insere(46,7); insere(20,22); insere(28,25); insere(19,26); insere(17,9).\n\n(Questão anulada no gabarito oficial — as cinco alternativas apresentam diferentes estados da tabela hash resultante; recomenda-se consultar a imagem original da prova para os valores completos de cada alternativa.)","alt":["(tabela hash — ver imagem original)","(tabela hash — ver imagem original)","(tabela hash — ver imagem original)","(tabela hash — ver imagem original)","(tabela hash — ver imagem original)"],"correct":null,"anulada":true,"exp":"Esta questão foi anulada pelo INEP no gabarito oficial e não possui resposta correta definida — utilize-a apenas como exercício de fixação sobre tratamento de colisões em tabelas hash por encadeamento."},{"id":"2021-34","ano":2021,"n":34,"area":"Redes de Computadores","enunciado":"Com o crescimento da população urbana, problemas de infraestrutura e de acesso limitado a recursos em diversas cidades ao redor do mundo afetam negativamente a vida de bilhões de pessoas. Tornar as cidades mais inteligentes pode ajudar a melhorar os serviços urbanos, aumentando a qualidade de vida de seus cidadãos. As Tecnologias da Informação e Comunicação (TIC) propiciam meios fundamentais para viabilizar essa mudança, entretanto, ainda existem desafios científicos e técnicos significativos que necessitam ser enfrentados antes que essas plataformas possam ser amplamente utilizadas.\n\nConsiderando as informações apresentadas, avalie as afirmações a seguir.\n\nI. Uma forma de enfrentar o problema da infraestrutura é tornar as cidades mais inteligentes e, para atingir esse objetivo, as TIC podem ser empregadas para coletar e analisar uma grande quantidade de informações geradas por diversas fontes de dados da cidade, como, por exemplo: redes de sensores, sistemas de trânsito e dispositivos dos cidadãos.\nII. Uma dificuldade que ocorre na maioria das aplicações de cidades inteligentes é que, geralmente, os sistemas são direcionados a um problema específico e são desenvolvidos desde o início com pouco reuso de software e sem a comunicação entre eles, o que gera maior trabalho e dificuldade na criação de aplicações que necessitem de dados e serviços de diversos domínios.\nIII. Entre os maiores desafios no desenvolvimento de aplicações para cidades inteligentes estão a garantia da privacidade e da segurança dos cidadãos, o gerenciamento do armazenamento e do processamento de grandes quantidades de dados, além da heterogeneidade de dispositivos existentes.\nIV. A Internet das Coisas (Internet of Things - IoT) faz uso de tecnologias e protocolos proprietários para conexão de objetos do cotidiano, tais como lâmpadas para iluminação pública, semáforos de trânsito e sensores de qualidade de água e ar, sendo que os objetos devem ser identificados com um nome único, sua posição e estado conhecidos, e devem ser acessíveis por meio de redes móveis.\n\nÉ correto apenas o que se afirma em:","alt":["I e IV.","II e III.","III e IV.","I, II e III.","I, II e IV."],"correct":"D","anulada":false,"exp":"As TIC de fato apoiam a coleta e análise de dados de sensores e sistemas urbanos (I); a falta de padronização e comunicação entre sistemas isolados é um desafio real de integração em cidades inteligentes (II); e a garantia de privacidade e segurança dos dados é um dos maiores desafios apontados (III). Já a IoT busca justamente padronizar a comunicação entre dispositivos com protocolos abertos, e não depender de protocolos proprietários, tornando IV falsa."},{"id":"2021-35","ano":2021,"n":35,"area":"IHC (Interação Humano-Computador)","enunciado":"A legibilidade diz respeito às características que possam dificultar ou facilitar a leitura das informações textuais, como, por exemplo: brilho do caractere, contraste letra/fundo, tamanho da fonte, espaçamento entre palavras, espaçamento entre linhas, espaçamento de parágrafos, comprimento da linha, entre outros.\n\nCYBIS, W.; BETIOL, A. H.; FAUST, R. Ergonomia e Usabilidade: Conhecimentos, Métodos e Aplicações. 2. ed. São Paulo: Novatec Editora Ltda. 2010 (adaptado).\n\nAcerca das características e importância da legibilidade, avalie as afirmações a seguir.\n\nI. Em uma interface legível, o texto longo deve ser lido rapidamente e deve aparecer em letras maiúsculas e minúsculas misturadas naturalmente, com maiúsculas no início de frases e nomes próprios.\nII. Os textos longos devem ser apresentados em linhas com menor comprimento possível e com o mínimo contraste efetivo com o fundo.\nIII. O texto que deve ser lido por idosos ou pessoas com problemas de visão aparece em letras claras sobre um fundo escuro, pois, para esse público, o fundo brilhante pode ofuscar completamente as letras escuras.\n\nÉ correto o que se afirma em:","alt":["II, apenas.","III, apenas.","I e II, apenas.","I e III, apenas.","I, II e III."],"correct":"D","anulada":false,"exp":"Um texto legível deve misturar maiúsculas e minúsculas naturalmente, sem prejudicar a leitura (I verdadeira); e para idosos ou pessoas com baixa visão, letras claras sobre fundo escuro realmente evitam o ofuscamento causado por fundos muito brilhantes (III verdadeira). Já para textos longos recomenda-se bom contraste com o fundo — o oposto do 'mínimo contraste' sugerido no item II, tornando-o falso."}]}</script>
<script>
(function(){
  "use strict";

  var DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  var AREAS = DATA.areas;
  var QUESTIONS = DATA.questions;

  var AREA_COLORS = {
    "Banco de Dados": "var(--area-bd)",
    "Engenharia de Software": "var(--area-es)",
    "Redes de Computadores": "var(--area-rede)",
    "Hardware / Arquitetura e Sistemas Operacionais": "var(--area-hw)",
    "IHC (Interação Humano-Computador)": "var(--area-ihc)",
    "Lógica e Programação": "var(--area-lp)",
    "Outros temas de SI (não cobertos pelas 6 áreas solicitadas)": "var(--area-out)"
  };

  var STORAGE_KEY = "enade_quiz_v1";

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    }catch(e){}
    return { studentName: "", answers: {}, nav: {} };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){
      console.warn("Não foi possível salvar no localStorage:", e);
    }
  }

  var state = loadState();
  if (!state.answers) state.answers = {};
  if (!state.nav) state.nav = {};

  function questionsByArea(area){
    return QUESTIONS.filter(function(q){ return q.area === area; })
      .sort(function(a,b){ return a.ano - b.ano || a.n - b.n; });
  }

  function scorableCount(list){
    return list.filter(function(q){ return !q.anulada; }).length;
  }

  function areaStats(area){
    var list = questionsByArea(area);
    var scorable = list.filter(function(q){ return !q.anulada; });
    var answeredAll = 0, answered = 0, correct = 0;
    list.forEach(function(q){
      var a = state.answers[q.id];
      if (a && a.selected){
        answeredAll++;
        if (!q.anulada){
          answered++;
          if (a.correct) correct++;
        }
      }
    });
    return { totalAll: list.length, answeredAll: answeredAll, total: scorable.length, answered: answered, correct: correct };
  }

  function overallStats(){
    var totalAnswered = 0, totalCorrect = 0, totalScorable = 0;
    AREAS.forEach(function(area){
      var s = areaStats(area);
      totalScorable += s.total;
      totalAnswered += s.answered;
      totalCorrect += s.correct;
    });
    return { total: totalScorable, answered: totalAnswered, correct: totalCorrect };
  }

  function allDoubts(){
    var out = [];
    QUESTIONS.forEach(function(q){
      var a = state.answers[q.id];
      if (a && a.duvida) out.push(q);
    });
    out.sort(function(a,b){
      if (a.area !== b.area) return AREAS.indexOf(a.area) - AREAS.indexOf(b.area);
      return a.ano - b.ano || a.n - b.n;
    });
    return out;
  }

  // ---------------- rendering helpers ----------------
  var mainEl = document.getElementById('main');
  var crumbEl = document.getElementById('crumb');
  var progressbarEl = document.getElementById('progressbar');
  var progressbarFillEl = document.getElementById('progressbarFill');

  function esc(str){
    var d = document.createElement('div');
    d.textContent = str == null ? "" : str;
    return d.innerHTML;
  }

  function looksLikeCode(text){
    if (!text) return false;
    return /\n/.test(text) && /(\{|\}|SELECT |CREATE TABLE|for \(|if \()/i.test(text);
  }

  function renderCrumb(view, areaName){
    crumbEl.innerHTML = "";
    if (view === 'home'){ progressbarEl.classList.add('hidden'); return; }
    var homeBtn = document.createElement('button');
    homeBtn.textContent = "Início";
    homeBtn.onclick = function(){ goHome(); };
    crumbEl.appendChild(homeBtn);
    if (areaName){
      var sep = document.createTextNode(" / ");
      crumbEl.appendChild(sep);
      var span = document.createElement('span');
      span.textContent = areaName;
      crumbEl.appendChild(span);
    }
    if (view === 'quiz') progressbarEl.classList.remove('hidden');
    else progressbarEl.classList.add('hidden');
  }

  // ---------------- HOME VIEW ----------------
  function goHome(){
    state.nav.view = 'home';
    saveState();
    renderHome();
  }

  function renderHome(){
    renderCrumb('home');
    var html = '';
    html += '<div class="name-row">';
    html += '<label for="studentName">Seu nome</label>';
    html += '<input type="text" id="studentName" placeholder="Digite seu nome completo" value="'+esc(state.studentName||'')+'">';
    html += '</div>';

    html += '<h2 class="section-title">Escolha uma área para começar</h2>';
    html += '<p class="section-sub">As questões são as mesmas do Componente Específico do ENADE (2014, 2017 e 2021). Seu progresso fica salvo neste navegador.</p>';
    html += '<ul class="area-list">';
    AREAS.forEach(function(area){
