<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENADE · Treino por Área — Sistemas de Informação</title>
<style>
  :root{
    --ink:#1B3A4B;
    --ink-2:#274960;
    --paper:#F3F5F3;
    --paper-2:#FFFFFF;
    --text:#212B31;
    --text-muted:#5B6B73;
    --line:#D8DEDD;
    --good:#1F7A54;
    --good-bg:#EAF5EF;
    --bad:#B3402C;
    --bad-bg:#FBECE8;
    --warn:#B8860B;
    --warn-bg:#FBF3E1;
    --area-bd:#1F6F78;
    --area-es:#2C4A6E;
    --area-rede:#5B4B8A;
    --area-hw:#A15C2A;
    --area-ihc:#8A4A5E;
    --area-lp:#2E6B4F;
    --area-out:#6B5B4D;
    --serif: Iowan Old Style, "Palatino Linotype", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--text);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- header ---------- */
  header.top{
    background:var(--ink);
    color:#EFF3F1;
    padding:28px 24px 22px;
  }
  header.top .wrap{max-width:760px;margin:0 auto;}
  header.top h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:1.7rem;
    margin:0 0 4px;
    letter-spacing:.2px;
  }
  header.top p{margin:0;color:#C9D6D2;font-size:.95rem;}
  header.top .crumb{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-size:.85rem;color:#AEC0BC;margin-top:10px;
  }
  header.top .crumb button{
    background:none;border:none;color:#DCE9E5;cursor:pointer;
    font-size:.85rem;text-decoration:underline;padding:0;font-family:var(--sans);
  }

  main{flex:1;max-width:760px;margin:0 auto;padding:28px 24px 80px;width:100%;}

  /* ---------- home ---------- */
  .name-row{
    display:flex;gap:10px;align-items:center;margin-bottom:28px;flex-wrap:wrap;
  }
  .name-row label{font-size:.9rem;color:var(--text-muted);}
  .name-row input{
    flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);
    border-radius:var(--radius);font-size:.95rem;font-family:var(--sans);
    background:var(--paper-2);color:var(--text);
  }
  .name-row input:focus{outline:2px solid var(--ink-2);outline-offset:1px;}

  h2.section-title{
    font-family:var(--serif);font-size:1.15rem;font-weight:600;
    margin:0 0 4px;color:var(--ink);
  }
  p.section-sub{color:var(--text-muted);font-size:.92rem;margin:0 0 18px;}

  .area-list{list-style:none;margin:0 0 32px;padding:0;border-top:1px solid var(--line);}
  .area-item{
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;
    padding:16px 4px;
  }
  .area-item .accent{width:5px;align-self:stretch;border-radius:2px;flex-shrink:0;}
  .area-item .info{flex:1;min-width:0;}
  .area-item .info .name{font-family:var(--serif);font-size:1.05rem;font-weight:600;color:var(--text);}
  .area-item .info .meta{font-size:.82rem;color:var(--text-muted);margin-top:3px;}
  .area-item .progress-track{
    height:5px;background:var(--line);border-radius:3px;margin-top:8px;max-width:260px;overflow:hidden;
  }
  .area-item .progress-fill{height:100%;border-radius:3px;}
  .area-item button.go{
    flex-shrink:0;background:var(--ink);color:#fff;border:none;
    padding:9px 16px;border-radius:var(--radius);font-size:.88rem;cursor:pointer;
    font-family:var(--sans);
  }
  .area-item button.go:hover{background:var(--ink-2);}

  .report-cta{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--paper-2);
  }
  .report-cta div strong{font-family:var(--serif);font-size:1rem;}
  .report-cta div p{margin:2px 0 0;color:var(--text-muted);font-size:.85rem;}
  .btn{
    background:var(--ink);color:#fff;border:none;padding:9px 18px;
    border-radius:var(--radius);font-size:.88rem;cursor:pointer;font-family:var(--sans);
  }
  .btn:hover{background:var(--ink-2);}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink);}
  .btn.ghost:hover{background:var(--ink);color:#fff;}
  .btn.subtle{background:none;color:var(--text-muted);border:1px solid var(--line);}
  .btn.subtle:hover{border-color:var(--text-muted);color:var(--text);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---------- quiz ---------- */
  .progressbar{height:4px;background:var(--line);}
  .progressbar .fill{height:100%;background:var(--ink-2);transition:width .25s ease;}

  .q-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
  .q-meta .tag{
    font-size:.75rem;padding:3px 9px;border-radius:20px;color:#fff;
  }
  .q-meta .pos{color:var(--text-muted);font-size:.85rem;}

  .q-text{
    font-size:1.02rem;white-space:pre-wrap;margin:14px 0 20px;
  }
  .q-text.code, pre.code-block{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:.88rem;background:#fff;border:1px solid var(--line);
    padding:12px 14px;border-radius:var(--radius);white-space:pre;overflow-x:auto;
  }
  .anulada-note{
    background:var(--warn-bg);border-left:4px solid var(--warn);
    padding:10px 14px;font-size:.85rem;color:#6b5107;border-radius:var(--radius);margin-bottom:16px;
  }

  ul.alts{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--line);}
  ul.alts li{border-bottom:1px solid var(--line);}
  ul.alts label{
    display:flex;align-items:flex-start;gap:12px;padding:13px 6px;cursor:pointer;
  }
  ul.alts input[type=radio]{display:none;}
  .badge{
    flex-shrink:0;width:28px;height:28px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:.85rem;font-weight:600;color:var(--text-muted);margin-top:1px;
    font-family:var(--sans);
  }
  ul.alts input[type=radio]:checked + .badge{
    background:var(--ink);border-color:var(--ink);color:#fff;
  }
  ul.alts .alt-text{padding-top:3px;font-size:.95rem;white-space:pre-wrap;}
  ul.alts .alt-text.code{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:.85rem;white-space:pre;}

  ul.alts li.is-correct .badge{background:var(--good) !important;border-color:var(--good) !important;color:#fff !important;}
  ul.alts li.is-correct{background:var(--good-bg);}
  ul.alts li.is-wrong .badge{background:var(--bad) !important;border-color:var(--bad) !important;color:#fff !important;}
  ul.alts li.is-wrong{background:var(--bad-bg);}
  ul.alts li.answered label{cursor:default;}

  .feedback{
    border-left:4px solid var(--good);background:var(--good-bg);
    padding:14px 16px;border-radius:var(--radius);margin-bottom:20px;
  }
  .feedback.wrong{border-left-color:var(--bad);background:var(--bad-bg);}
  .feedback.neutral{border-left-color:var(--warn);background:var(--warn-bg);}
  .feedback h3{margin:0 0 6px;font-family:var(--serif);font-size:1.02rem;}
  .feedback.wrong h3{color:var(--bad);}
  .feedback:not(.wrong):not(.neutral) h3{color:var(--good);}
  .feedback p{margin:0;font-size:.92rem;color:#3a3a3a;}

  .actions-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .actions-row .left-group, .actions-row .right-group{display:flex;gap:10px;flex-wrap:wrap;}

  .doubt-toggle{
    display:inline-flex;align-items:center;gap:7px;font-size:.85rem;color:var(--text-muted);
    border:1px solid var(--line);padding:8px 14px;border-radius:20px;cursor:pointer;background:var(--paper-2);
  }
  .doubt-toggle.active{background:var(--warn-bg);border-color:var(--warn);color:#6b5107;}
  .doubt-toggle input{margin:0;}

  /* ---------- report ---------- */
  table.report-table{width:100%;border-collapse:collapse;margin-bottom:28px;font-size:.9rem;}
  table.report-table th, table.report-table td{
    text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);
  }
  table.report-table th{color:var(--text-muted);font-weight:600;font-size:.78rem;text-transform:none;}
  table.report-table td.num, table.report-table th.num{text-align:right;}
  table.report-table tr.total-row td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;}
  .bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;width:100px;display:inline-block;vertical-align:middle;margin-left:8px;}
  .bar-fill{height:100%;background:var(--ink-2);}

  .doubt-list{list-style:none;margin:0 0 28px;padding:0;}
  .doubt-list li{
    border:1px solid var(--warn);background:var(--warn-bg);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:10px;font-size:.88rem;
  }
  .doubt-list li .dq-head{font-weight:700;color:#6b5107;margin-bottom:3px;}
  .doubt-list li .dq-text{color:#4a3d09;}
  .empty-note{color:var(--text-muted);font-size:.9rem;font-style:italic;}

  footer.export{
    display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;
  }

  .hidden{display:none !important;}
  a.back-link{color:var(--ink);font-size:.85rem;text-decoration:none;border-bottom:1px solid var(--ink);}
  a.back-link:hover{opacity:.7;}

  @media (max-width:520px){
    header.top{padding:22px 16px 18px;}
    main{padding:22px 16px 64px;}
    .area-item{flex-wrap:wrap;}
    .area-item button.go{margin-left:21px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="wrap">
      <h1>ENADE · Treino por Área</h1>
      <p>Sistemas de Informação — questões oficiais de 2014, 2017 e 2021</p>
      <div class="crumb" id="crumb"></div>
    </div>
  </header>

  <div class="progressbar hidden" id="progressbar"><div class="fill" id="progressbarFill"></div></div>

  <main id="main"></main>

</div>

<script id="quiz-data" type="application/json">{"areas":["Banco de Dados","Engenharia de Software","Redes de Computadores","Hardware / Arquitetura e Sistemas Operacionais","IHC (Interação Humano-Computador)","Lógica e Programação","Outros temas de SI (não cobertos pelas 6 áreas solicitadas)"],"questions":[{"id":"2014-9","ano":2014,"n":9,"area":"Lógica e Programação","enunciado":"Considere uma situação em que um professor que queira saber se existem alunos cursando, ao mesmo tempo, as disciplinas A e B, tenha implementado um programa que: 1) inicializa um array a de 30 posições que contém as matrículas dos alunos da disciplina A; 2) inicializa outro array b de 40 posições, que contém as matrículas dos alunos da disciplina B; 3) imprime a matrícula dos alunos que estão cursando as disciplinas A e B ao mesmo tempo. Considere, ainda, que os arrays foram declarados e inicializados, não estão necessariamente ordenados, e seus índices variam entre 0 e n-1, sendo n o tamanho do array.\n\n1. for (i = 0 to 29) {\n2.    for (j = 0 to 39) {\n3.\n4.\n5.\n      }\n}\n\nCom base nessas informações, conclui-se que o trecho a ser incluído nas linhas 3, 4 e 5 do código acima, para que o programa funcione corretamente, é:","alt":["3. if (a[i] == b[j]) {\n4.   print(a[i]);\n5. }","3. if (a[j] == b[i]) {\n4.   print(a[j]);\n5. }","3. if (a[i] == b[j]) {\n4.   print(a[j]);\n5. }","3. if (a[i] == b[i]) {\n4.   print(a[i]);\n5. }","3. if (a[j] == b[j]) {\n4.   print(a[j]);\n5. }"],"correct":"A","anulada":false,"exp":"Como i percorre o array a (0 a 29) e j percorre o array b (0 a 39), a comparação correta é a[i] == b[j]; ao encontrar coincidência, imprime-se a matrícula comum — a[i] (equivalente a b[j])."},{"id":"2014-10","ano":2014,"n":10,"area":"Lógica e Programação","enunciado":"A área de complexidade de algoritmos abrange a medição da eficiência de um algoritmo frente à quantidade de operações realizadas até que ele encontre seu resultado final.\n\nA respeito desse contexto, suponha que um arquivo texto contenha o nome de N cidades de determinado estado, que cada nome de cidade esteja separado do seguinte por um caractere especial de fim de linha e classificado em ordem alfabética crescente. Considere um programa que realize a leitura linha a linha desse arquivo, à procura de nome de cidade.\n\nCom base nessa descrição, verifica-se que a complexidade desse programa é:","alt":["O(1), em caso de busca sequencial.","O(N), em caso de busca sequencial.","O(log₂N), em caso de busca binária.","O(N), em caso de transferência dos nomes para uma árvore binária e, então, realizar a busca.","O(log₂N), em caso de transferência dos nomes para uma árvore binária e, então, realizar a busca."],"correct":"B","anulada":false,"exp":"Numa busca sequencial em uma lista com N elementos, no pior caso é preciso percorrer todos os N registros até encontrar (ou não) o nome procurado, o que caracteriza complexidade O(N)."},{"id":"2014-11","ano":2014,"n":11,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"Considere que uma rede de supermercados tenha contratado um analista de informática para elaborar um plano de prevenção de erros na operação do software das lojas. Com o objetivo de melhorar a tomada de decisão, o analista classificou os erros quanto ao tempo de emprego do operador (linha) e quanto aos setores que originaram os erros (coluna). Os dados levantados são apresentados na tabela abaixo.\n\nTabela de erros da operação do software — Setor do supermercado\nTempo de emprego do operador | Caixa | Padaria | Açougue | TOTAL\n< 2 anos (A)      | 55  | 25 | 10 | 90\n2 a 4 anos (B)     | 20  | 6  | 4  | 30\n> 4 anos (C)       | 35  | 15 | 10 | 60\nTOTAL              | 110 | 46 | 24 | 180\n\nConsiderando essas informações, conclui-se que a probabilidade aproximada de um erro ser cometido por um operador com tempo de emprego correspondente a 4 anos ou menos é de:","alt":["17%.","33%.","50%.","67%.","83%."],"correct":"D","anulada":false,"exp":"Erros cometidos por operadores com até 4 anos de emprego somam as categorias A (≤2 anos) e B (2 a 4 anos): (90+30)/180 = 120/180 ≈ 67%."},{"id":"2014-12","ano":2014,"n":12,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"Considere a situação em que uma empresa que comercializa software customizado precisa definir a alocação de quantidade de horas de trabalho para um programador e um desenvolvedor. Considere, ainda, que os profissionais estão envolvidos no projeto de um sistema composto por módulos de controle de estoque e vendas e que os recursos financeiros a serem investidos para realizar as atividades de programação e desenvolvimento para cada hora trabalhada nos respectivos módulos são indicados na tabela abaixo. Assim, por exemplo, o custo unitário por hora trabalhada na atividade de programação no módulo de estoque é $3, ao passo que o custo do desenvolvimento do respectivo módulo é $6.\n\nMódulo — Atividade: Estoque | Vendas\nProgramação: 3 | 3\nDesenvolvimento: 6 | 3\n\nO valor previsto em orçamento para a atividade de programação é de $30, e para a de desenvolvimento é de $48. Ao modelar esse problema para ser resolvido com a técnica de pesquisa operacional, define-se V como a quantidade de horas alocadas no módulo de vendas e E como a quantidade de horas alocadas no módulo de estoque. Nesse modelo, uma das restrições a serem utilizadas é representada por:","alt":["3E + 3V ≤ 30.","3E + 3V ≥ 30.","3E + 3V ≤ 48.","6E + 3V ≤ 30.","6E + 3V ≥ 48."],"correct":"A","anulada":false,"exp":"O orçamento de programação é de $30, com custo unitário de $3 por hora tanto no módulo de estoque (E) quanto no de vendas (V); logo, a restrição é 3E + 3V ≤ 30."},{"id":"2014-13","ano":2014,"n":13,"area":"Lógica e Programação","enunciado":"Na figura 1, está representado, esquematicamente, um processo de tradução de um programa (arquivo fonte) em um código binário. Esse processo de compilação clássica é utilizado em compiladores como os das linguagens C e Pascal.\n\nFigura 1 — Arquivo fonte → Compilação → Código binário (Processo de compilação clássica)\n\nNa figura 2, está representado, esquematicamente, um processo de tradução de um programa (arquivo fonte) em um código intermediário. Esse processo híbrido é utilizado em compiladores como os das linguagens Java e C#.\n\nFigura 2 — Arquivo fonte → Compilação → Código intermediário → Interpretação → Código binário (Processo híbrido)\n\nConsiderando que, em ambos os processos, o código binário é o que será executado pelo computador, e que a execução de dois programas gerados, cada qual por um dos processos apresentados, ocorre em situações equivalentes, avalie as afirmações a seguir.\n\nI. Há portabilidade para a execução de ambos os programas gerados em cada processo.\nII. Na execução do programa gerado por meio do processo híbrido, o consumo de memória é maior que na execução pelo processo de compilação clássica.\nIII. O desempenho na execução do programa gerado pelo processo de compilação clássica é melhor que na execução pelo processo híbrido.\n\nÉ correto o que se afirma em:","alt":["I, apenas.","III, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"correct":"D","anulada":false,"exp":"A compilação híbrida (com bytecode intermediário) consome mais memória e tem desempenho de execução inferior a um binário nativo gerado por compilação clássica (II e III verdadeiras). Já a portabilidade não é automática nos dois casos — o binário da compilação clássica é específico da plataforma, tornando I falsa."},{"id":"2014-14","ano":2014,"n":14,"area":"Lógica e Programação","enunciado":"A tabela abaixo apresenta o ranking das 20 linguagens de programação mais populares (Jul/2014, comparado a Jul/2013), segundo o índice TIOBE, com o percentual de popularidade de cada linguagem (ex.: 1º C 17,145%; 2º Java 15,688%; 3º Objective-C 10,294%; 4º C++ 5,520%; 5º Visual Basic 4,341%; 6º C# 4,051%; 7º PHP 2,916%; 8º Python 2,656%; 9º JavaScript 1,806%; 10º Transact-SQL 1,759%; e assim sucessivamente até a 20ª posição, Assembly, com 0,777%).\n\nDisponível em: <http://www.tiobe.com>. Acesso em: 23 jul. 2014 (adaptado).\n\nConsiderando a classificação das linguagens de programação apresentada na tabela, avalie as afirmações a seguir.\n\nI. O ranking é liderado por uma linguagem de terceira geração e de paradigma funcional.\nII. Linguagens com licença livre têm participação inferior a 20%, se somados os percentuais de popularidade.\nIII. É maior, no ranking, a participação de linguagens que utilizam o paradigma orientado a objetos que a das linguagens que utilizam os demais paradigmas.\n\nÉ correto o que se afirma em:","alt":["II, apenas.","III, apenas.","I e II, apenas.","I e III, apenas.","I, II e III."],"correct":"B","anulada":false,"exp":"O ranking é liderado por C, uma linguagem procedural (não funcional), tornando I falsa. Somando os percentuais das linguagens de licença livre (C, PHP, Python, JavaScript etc.) o total ultrapassa 20%, tornando II falsa. Já a soma das linguagens orientadas a objetos (Java, Objective-C, C++, C#, Visual Basic.NET etc.) supera a das demais, tornando III verdadeira."},{"id":"2014-15","ano":2014,"n":15,"area":"Banco de Dados","enunciado":"Os sistemas de informação podem ser classificados em sistemas OLTP (Online Transaction Processing) e sistemas OLAP (Online Analytical Processing).\n\nA respeito desses tipos de sistemas, avalie as asserções a seguir e a relação proposta entre elas.\n\nI. Em sistemas OLTP, os dados são normalmente estruturados em um modelo relacional normalizado, e em sistemas OLAP, os dados são normalmente estruturados em um modelo multidimensional; contudo, esses sistemas estão inter-relacionados.\n\nPORQUE\n\nII. Os sistemas OLAP, na maioria das vezes, obtêm dados a partir de processos ETL (Extract, Transform, Load), que recuperam e transformam os dados obtidos a partir das bases de dados dos sistemas OLTP.\n\nA respeito dessas asserções, assinale a opção correta.","alt":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"correct":"A","anulada":false,"exp":"Em sistemas OLTP os dados seguem um modelo relacional normalizado, e em OLAP um modelo multidimensional; ambos se conectam por meio de processos ETL, que extraem e transformam dados do OLTP para o OLAP — a asserção II é uma justificativa correta da I."},{"id":"2014-16","ano":2014,"n":16,"area":"Hardware / Arquitetura e Sistemas Operacionais","enunciado":"A virtualização de servidores, acompanhada de solução para Gerenciamento Eletrônico de Documentos (GED), trouxe uma série de benefícios para as escolas de uma instituição: acumulados ao longo de 50 anos, os prontuários dos estudantes passaram a ser acessados em tempo real, as atividades pedagógicas realizadas em ambiente mais sólido e o gerenciamento centralizado do ambiente passou a permitir que a equipe da instituição se concentre em tarefas estratégicas. No médio prazo, a meta da instituição é virtualizar toda a infraestrutura de servidores e eliminar o uso de papel nos processos, trocando documentos em papel por documentos eletrônicos armazenados nos servidores virtuais e acessíveis em qualquer unidade da rede de escolas.\n\nComputerworld, Virtualização: quatro casos de sucesso no Brasil. Disponível em: <http://cio.com.br>. Acesso em: 29 jul. 2014 (adaptado).\n\nEm relação ao estudo de caso mencionado acima, avalie as asserções a seguir e a relação proposta entre elas.\n\nI. A tecnologia de virtualização de servidores está proporcionando diversos benefícios para as organizações, como redução de custos e de downtime e melhoria no desempenho, na segurança e no gerenciamento da infraestrutura de Tecnologia da Informação (TI). No entanto, sozinha, a virtualização não é suficiente para permitir que as organizações se concentrem em tarefas estratégicas.\n\nPORQUE\n\nII. A virtualização, se associada a outras tecnologias atuais como GED, Cloud Computing e Grid Computing, possibilita que as organizações foquem no negócio, eliminando os riscos associados à área de TI.\n\nA respeito dessas asserções, assinale a opção correta.","alt":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"correct":"E","anulada":false,"exp":"A virtualização de fato traz benefícios de custo, desempenho e gerenciamento, mas sozinha não garante foco total em tarefas estratégicas (torna a I uma afirmação verdadeira, ao contrário do que se poderia supor à primeira vista) — porém a asserção II generaliza demais ao dizer que a combinação de tecnologias 'elimina os riscos associados à área de TI', o que é uma proposição falsa; com I verdadeira e II falsa, a opção correta indica ambas como falsas segundo o gabarito oficial, refletindo que a argumentação da II não sustenta uma eliminação total de riscos."},{"id":"2014-17","ano":2014,"n":17,"area":"Hardware / Arquitetura e Sistemas Operacionais","enunciado":"Os estados que um processo alcança podem ser modelados por meio do diagrama de estados exibido a seguir (Novo → Pronto → Executando → Terminado, com transição também para Bloqueado, sendo as transições numeradas de 1 a 4 entre os estados Pronto/Executando/Bloqueado).\n\nTANENBAUM, A. S. Sistemas Operacionais Modernos. 3. ed. São Paulo: Pearson do Brasil, 2010 (adaptado).\n\nNo diagrama de estados apresentado, as transições causadas pelo escalonador de processos são:","alt":["1 e 2.","1 e 3.","1 e 4.","2 e 3.","2 e 4."],"correct":"D","anulada":false,"exp":"O escalonador de processos é responsável pelas transições entre os estados Pronto e Executando (conceder e retirar a CPU do processo), que correspondem às transições numeradas 2 e 4 no diagrama de estados apresentado."},{"id":"2014-18","ano":2014,"n":18,"area":"Engenharia de Software","enunciado":"Uma empresa que comercializa seguros conta atualmente com diferentes sistemas de informação, perfazendo cada um deles uma atividade pelos departamentos de marketing, finanças, operações e tecnologia da informação (TI), conforme ilustra a figura a seguir (Empresa → Departamentos: Marketing, Finanças, Operações, TI; Atividades: Venda do seguro, Emissão de apólice, Acompanhamento, Suporte tecnológico). Considerando a importância estratégica de uma arquitetura empresarial de sistemas de informação funcionalmente integrada, a empresa, após um estudo de viabilidade, identificou que haveria redução significativa de custos caso as atividades fossem gerenciadas como um processo integrado.\n\nAo estruturar uma arquitetura de negócios orientada à integração do processo, que forma funcional a empresa deve adotar?","alt":["Orientação vertical.","Orientação horizontal.","Orientação a processos de TI.","Orientação a processos departamentais.","Orientação a processos colaborativos."],"correct":"E","anulada":false,"exp":"Quando a integração de processos atravessa diversos departamentos (marketing, finanças, operações, TI) para reduzir custos, a forma funcional adequada é a orientação a processos colaborativos, que trata o fluxo entre áreas como um processo único e integrado."},{"id":"2014-19","ano":2014,"n":19,"area":"Hardware / Arquitetura e Sistemas Operacionais","enunciado":"Um analista de sistemas usa um computador para executar apenas 2 tipos de operações: processamento lógico/aritmético e acesso a disco.\n\nO computador é um servidor com apenas um processador de um núcleo (core). Além do sistema operacional multitarefa e dos processos do sistema, tal servidor serializa os acessos a disco e é usado para executar apenas os programas que o analista solicita. O analista trabalha com dois tipos de programas: aqueles que realizam em torno de 100% de operações lógicas/aritméticas (quantidade desprezível de acesso a disco), denominados cpu-bound, e aqueles que executam em torno de 70% de acesso a disco e 30% de operações lógicas/aritméticas, denominados io-bound. Certa vez, o analista executou alguns programas isoladamente e mediu os tempos de execução de cada um. Os dados obtidos foram registrados na tabela I. Em seguida, ele combinou programas e os submeteu simultaneamente em grupos. Os resultados foram registrados na tabela II.\n\nTabela I — Programa / Tipo / Tempo de execução (ut): P01 CPU-BOUND 20; P02 CPU-BOUND 40; P03 CPU-BOUND 60; P04 IO-BOUND 50; P05 IO-BOUND 100; P06 IO-BOUND 150.\n\nTabela II — Grupo / Tempo de execução (ut): 1: P01+P02+P03 = 123; 2: P04+P05+P06 = 210; 3: P03+P05+P06 = 160; 4: Todos = 306.\n\nDias depois, revendo as tabelas, ele teve dúvida quanto à correção dos tempos anotados. Considere ut = unidade de tempo.\n\nCom relação a essa situação, avalie as afirmações a seguir.\n\nI. É possível que o tempo total do grupo 4 seja 306 ut.\nII. O tempo total do grupo 1 deveria ser, no mínimo, de 100 ut.\nIII. O tempo total do grupo 2 deveria ser, no mínimo, de 300 ut.\nIV. O tempo total do grupo 3 deveria estar acima de 175 e abaixo de 310 ut.\n\nÉ correto o que se afirma em:","alt":["I, apenas.","I e II, apenas.","I e IV, apenas.","I, III e IV, apenas.","I, II, III e IV."],"correct":"C","anulada":false,"exp":"Como o servidor tem um único núcleo, o tempo total de qualquer grupo de programas executados simultaneamente não pode ser menor que o tempo do programa mais demorado isoladamente, mas a soma de tempos com sobreposição de I/O e CPU impõe limites mínimo e máximo específicos — apenas as afirmações I e IV respeitam esses limites físicos considerando os dados da tabela."},{"id":"2014-20","ano":2014,"n":20,"area":"Redes de Computadores","enunciado":"A Internet se encontra organizada em Sistemas Autônomos (SA), que são administrados autonomamente por uma entidade ou organização. Para que uma comunicação ocorra com sucesso entre hospedeiros situados em SAs diferentes, é necessário que pacotes sejam eficientemente transportados do SA origem ao SA destino. Protocolos de roteamento são responsáveis pelo estabelecimento de rotas a serem seguidas pelos pacotes. Para que essas rotas sejam estabelecidas, deve-se usar:","alt":["Border Gateway Protocol (BGP).","Open Shortest Path First (OSPF).","Routing Information Protocol (RIP).","Interior Gateway Routing Protocol (IGRP).","Intermediate System To Intermediate System (IS-IS)."],"correct":"A","anulada":false,"exp":"O BGP (Border Gateway Protocol) é o protocolo padrão usado para o roteamento entre Sistemas Autônomos na Internet; OSPF, RIP e IS-IS são protocolos de roteamento interno (intra-AS), não indicados para esse propósito."},{"id":"2014-21","ano":2014,"n":21,"area":"Engenharia de Software","enunciado":"Um gerente de projetos acabou de assumir um projeto em andamento, em que foram identificados vários problemas. Os recursos são limitados e, por isso, é necessário priorizar os problemas a serem solucionados. Nessa situação, a ferramenta que o gerente deve utilizar é:","alt":["o gráfico de controle.","o diagrama de Pareto.","o diagrama de dispersão.","a amostragem estatística.","o diagrama de causa e efeito."],"correct":"B","anulada":false,"exp":"O Diagrama de Pareto evidencia quais poucos problemas concentram a maior parte dos impactos (princípio 80/20), sendo a ferramenta indicada para priorizar quais problemas resolver primeiro com recursos limitados."},{"id":"2014-22","ano":2014,"n":22,"area":"Redes de Computadores","enunciado":"As transações eletrônicas na Internet precisam de mecanismos de segurança capazes de garantir autenticidade, confidencialidade e integridade das informações.\n\nCom relação a esse contexto, avalie as afirmações a seguir.\n\nI. Criptografia assimétrica é um método em que é utilizado um par de chaves: uma pública e uma privada.\nII. Certificado digital é um documento eletrônico assinado digitalmente que permite associar uma pessoa ou entidade a uma chave pública.\nIII. Assinatura digital é um método de autenticação de informação digital tipicamente tratado como análogo à assinatura física em papel.\nIV. VPN (Virtual Private Network) é um dispositivo de uma rede de computadores por meio do qual se aplica uma política de segurança a determinado ponto da rede.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","I e IV.","II e III.","I, II e III.","I, III e IV."],"correct":"D","anulada":false,"exp":"Criptografia assimétrica (par de chaves pública/privada), certificado digital (associa identidade a uma chave pública) e assinatura digital (análoga à assinatura física) estão corretamente descritos (I, II e III); já a VPN é uma tecnologia de rede virtual privada, não um 'dispositivo físico' aplicado a um ponto da rede, tornando IV falsa."},{"id":"2014-23","ano":2014,"n":23,"area":"Engenharia de Software","enunciado":"Uma companhia com abrangência global decidiu implantar um novo sistema de compartilhamento de informações empresariais. Após estudos de campo, a empresa identificou alguns cenários de utilização das informações. No primeiro cenário, detectou-se que um volume massivo de dados relativos a documentos históricos, normas e regulamentos da organização eram consumidos, em escala global, exclusivamente para leitura. No segundo cenário, verificou-se que documentos eram produzidos de forma colaborativa por equipes regionais de colaboradores. Esses colaboradores, na maioria das vezes, estavam na mesma filial ou geograficamente muito próximos. O terceiro cenário envolvia apenas 10% dos documentos da empresa, acessados concorrentemente por todas as regionais do globo, tanto para leitura quanto para atualização.\n\nCom base nesses cenários e em relação às arquiteturas de software distribuídas coerentes com as necessidades da empresa, avalie as afirmações a seguir.\n\nI. A utilização de arquitetura peer-to-peer (P2P) para disponibilizar os documentos do cenário 1 poderá reduzir o consumo da rede.\nII. O compartilhamento baseado no modelo cliente-servidor com cache no cliente pode aumentar o desempenho da edição colaborativa, sem comprometer a consistência no cenário 2.\nIII. A utilização de replicação baseada em cópia primária pode aumentar a escalabilidade do sistema, sem comprometer, de forma significativa, a consistência de dados no cenário 3.\nIV. Se o modelo cliente-servidor de compartilhamento for empregado no cenário 2, a replicação passiva (backup ou mirroring) poderá ser utilizada como mecanismo de tolerância a falhas.\nV. A arquitetura peer-to-peer baseada em rede overlay, tal como o DHT, pode oferecer transparência de migração para os documentos compartilhados no cenário 1.\n\nÉ correto o que se afirma em:","alt":["II, apenas.","II e III, apenas.","II, IV e V, apenas.","I, II, IV e V, apenas.","I, II, III, IV e V."],"correct":"D","anulada":false,"exp":"P2P reduz o consumo de rede na distribuição de conteúdo somente para leitura em escala global (I); cache no cliente pode acelerar colaboração entre pessoas geograficamente próximas sem grande perda de consistência (II); replicação passiva serve bem como tolerância a falhas no cenário 2 (IV). Já cópia primária tende a gerar gargalo de escrita no cenário de alta concorrência (III falsa), e uma rede overlay P2P não é a solução mais adequada para o cenário 1, que é de leitura massiva e centralizada (V falsa)."},{"id":"2014-24","ano":2014,"n":24,"area":"Engenharia de Software","enunciado":"Uma empresa mantém um serviço de software que atende a centenas de clientes pelo mundo. O serviço é bastante complexo e requer um esforço contínuo de manutenção. Para melhor gerenciar a manutenção do sistema, a empresa decidiu implantar um programa de medição, em que várias métricas foram agregadas, cada uma delas associada a determinada questão que se desejava responder. A tabela a seguir apresenta as questões e suas métricas associadas:\n\n- Quantos problemas afetam os clientes? → Número de solicitações de mudanças.\n- Quanto tempo é necessário para se corrigir um problema urgente? → Tempo entre levantamento do problema e aceitação da mudança.\n- Quanto custa uma entrega de manutenção? → Custo por entrega.\n- Como são alocados os custos? → Custo por atividade.\n- Que tipos de mudanças são feitas? → Número de mudanças por tipo.\n- Quanto esforço é despendido por tipo de mudança? → Pessoas-dia gastos, agregados por tipo.\n- Quão difícil é a entrega? → Número de recursos computacionais a serem utilizados.\n\nO objetivo atual da empresa é reduzir o prazo de suas entregas, sem comprometer o que foi acordado com o cliente. A métrica que permite avaliar se esse objetivo está sendo atingido é o(a):","alt":["custo por entrega.","número de mudanças por tipo.","número de solicitações de mudanças.","número de recursos computacionais a serem utilizados.","tempo entre levantamento do problema e aceitação da mudança."],"correct":"E","anulada":false,"exp":"O objetivo é reduzir o prazo das entregas sem comprometer o que foi acordado — a métrica diretamente ligada a esse objetivo é o tempo entre o levantamento do problema e a aceitação da mudança, que mede exatamente a agilidade do processo de correção."},{"id":"2014-25","ano":2014,"n":25,"area":"Engenharia de Software","enunciado":"No desenvolvimento de um certo produto de software, foi determinado que um dos requisitos do produto seria a exibição de informações em planilhas eletrônicas. Contudo, durante uma reunião de revisão, a equipe do projeto verificou que esse formato não facilitava a interpretação das informações e sugeriu que fosse construído um gráfico, que permitiria a identificação mais rápida de informações importantes. Diante desse fato, o gerente do projeto deve:","alt":["autorizar a equipe do projeto a implementar o gráfico e registrar a mudança.","solicitar à equipe do projeto que ignore a sugestão, uma vez que ela está fora do escopo definido.","analisar o impacto da modificação e submetê-la à aprovação do cliente, independentemente da relevância do impacto.","analisar o impacto da modificação e, somente se o impacto no projeto for grande, submetê-la à aprovação do cliente.","autorizar a equipe do projeto a implementar o gráfico e desprezar o registro da mudança, atendendo à recomendação de que sejam rastreadas apenas mudanças cujo impacto seja significativo no custo ou nos prazos do projeto."],"correct":"C","anulada":false,"exp":"Toda mudança de escopo, mesmo que pareça pequena, deve ser formalmente avaliada quanto ao impacto e submetida à aprovação do cliente — esse é o processo padrão de controle de mudanças, independentemente do tamanho do impacto identificado."},{"id":"2014-26","ano":2014,"n":26,"area":"Engenharia de Software","enunciado":"Uma empresa de desenvolvimento de software está sendo avaliada no nível E do MPS.BR. O grupo de melhoria de processos fez um levantamento para avaliar as práticas relacionadas à gerência de recursos humanos e obteve as evidências a seguir.\n\nEvidência 1. A empresa possui um processo de avaliação de desempenho e promoção de indivíduos bem estabelecido, em plano de cargos e carreira.\n\nEvidência 2. A empresa contrata externamente instrutores capacitados para realizar treinamentos internos a seus funcionários sempre que verifica a necessidade de ampliar a capacitação da equipe. Esses treinamentos, registrados como parte do portfólio de cada funcionário, são avaliados pelos funcionários em relação a sua qualidade e aderência às necessidades de capacitação da equipe. Cada funcionário também é avaliado ao final de cada treinamento.\n\nDe acordo com o Modelo de Referência do MPS.BR, alguns dos resultados esperados para o processo de Gerência de Recursos Humanos são:\nGRH 6. Os treinamentos identificados como sendo responsabilidade da organização são conduzidos e registrados;\nGRH 7. A efetividade do treinamento é avaliada;\nGRH 8. Critérios objetivos para avaliação do desempenho de grupos e indivíduos são definidos e monitorados para prover informações sobre o desempenho e melhorá-lo.\n\nCom base no levantamento inicial das práticas da empresa, verifica-se que a evidência 1:","alt":["atende totalmente ao GRH 8, enquanto a evidência 2 atende totalmente ao GRH 6 e ao GRH 7.","atende parcialmente ao GRH 8, enquanto a evidência 2 atende totalmente ao GRH 6 e ao GRH 7.","atende parcialmente ao GRH 8, enquanto a evidência 2 atende parcialmente ao GRH 6 e ao GRH 7.","atende totalmente ao GRH 8, enquanto a evidência 2 não atende ao GRH 6, mas atende totalmente ao GRH 7.","atende parcialmente ao GRH 8, enquanto a evidência 2 atende totalmente ao GRH 6, mas não atende ao GRH 7."],"correct":"B","anulada":false,"exp":"A evidência 1 (plano de cargos e avaliação de desempenho) atende apenas parcialmente ao GRH 8, pois não menciona critérios objetivos monitorados continuamente; já a evidência 2 (treinamentos com registro e avaliação de efetividade) atende integralmente aos resultados esperados GRH 6 e GRH 7."},{"id":"2014-27","ano":2014,"n":27,"area":"Engenharia de Software","enunciado":"O gráfico a seguir, elaborado pelo diretor de tecnologia da informação de uma empresa, apresenta um modelo para a qualidade de produto de software com base no seu custo e no seu valor para a organização, ao longo do tempo, destacando cinco regiões (1 a 5): A - Custo decorrente de falhas; B - Custo total; C - Custo do desenvolvimento; D - Valor do produto; E - Valor líquido.\n\nCOHEN, M.; CHARD, J. Quality Management Best Practices. Dr. Dobb's Journal, novembro 2010. Disponível em: <http://www.drdobbs.com>. Acesso em: 13 jul. 2014 (adaptado).\n\nA região representada no gráfico em que o produto de software deve ser lançado no mercado para permitir que a organização tenha o melhor valor de retorno do investimento é a:","alt":["1.","2.","3.","4.","5."],"correct":"C","anulada":false,"exp":"A região 3 do gráfico representa o ponto de equilíbrio entre o custo de desenvolvimento (ainda controlado) e o valor agregado ao produto (ainda alto), correspondendo ao melhor momento para lançamento e maior retorno sobre o investimento."},{"id":"2014-28","ano":2014,"n":28,"area":"IHC (Interação Humano-Computador)","enunciado":"Conforme a norma ISO 9241, a usabilidade é definida como a capacidade que um sistema interativo de software oferece a seus usuários, em um contexto específico de operação, para a realização de tarefas de maneira eficaz, eficiente e agradável. Com fundamento nesse conceito, uma empresa deseja medir a satisfação dos consumidores de seus produtos e, para isso, desenvolverá um sistema de software. A equipe de desenvolvimento do sistema de software elencou os requisitos listados na tabela abaixo:\n\nRQ1: Cada produto da empresa deverá ser avaliado, por um usuário, com um valor numérico inteiro entre -5 e 5.\nRQ2: Cada transação do sistema com o banco de dados para registrar uma avaliação de um produto deve ser realizada em um tempo inferior a 20 segundos.\nRQ3: Cada operação do usuário deverá ser realizada em até três telas.\nRQ4: O sistema deve ter interface com sistemas legados.\nRQ5: O usuário consumidor irá identificar-se pelo código do número de Cadastro de Pessoa Física (CPF).\n\nEntre os requisitos listados na tabela, o código do que se refere à usabilidade é:","alt":["RQ1.","RQ2.","RQ3.","RQ4.","RQ5."],"correct":"C","anulada":false,"exp":"RQ3 trata do número de telas necessárias para concluir uma operação, um atributo direto de eficiência de uso (usabilidade); os demais requisitos tratam de desempenho técnico (RQ1, RQ2), integração de sistemas (RQ4) ou identificação do usuário (RQ5), não de usabilidade."},{"id":"2014-29","ano":2014,"n":29,"area":"Redes de Computadores","enunciado":"Na auditoria externa independente, contratada por uma empresa para verificar o plano de contingência e recuperação de desastres, é necessário analisar:","alt":["os sistemas de backup e a facilidade de recuperação dos dados.","os registros de tentativas de violação de segurança nos sistemas.","os pontos de vulnerabilidade na rede de computadores da empresa.","a documentação dos sistemas de informação da empresa e sua utilidade para os usuários.","os mecanismos de monitoramento dos sistemas de informação que permitam identificar problemas de desempenho."],"correct":"A","anulada":false,"exp":"Uma auditoria de plano de contingência e recuperação de desastres deve avaliar justamente a existência e a eficácia dos sistemas de backup e a real capacidade de recuperação dos dados em caso de incidente."},{"id":"2014-30","ano":2014,"n":30,"area":"Banco de Dados","enunciado":"Considere que uma empresa que presta serviços de transporte de pacientes em ambulâncias para clientes conveniados disponha de um sistema de controle e gerenciamento de atendimentos e viagens realizados. Considere, ainda, que, em atendimento, é utilizada uma ambulância e são registrados a data e o convênio a que o atendimento está vinculado. Em um atendimento, uma ambulância realiza uma ou mais viagens e, a cada viagem, é incrementado um número sequencial que começa em 1. Nessa situação, o esquema relacional simplificado, mostrado a seguir, foi projetado para suportar um banco de dados que controle a operação. No esquema, as chaves primárias têm seus atributos componentes sublinhados.\n\nPaciente (CodPaciente, Nome, Endereço)\nConvênio (CodConvênio, Empresa, Plano)\nAtendimento (CodAtendimento, CodPaciente, CodConvênio, Data, Finalidade)\nViagem (CodAtendimento, Sequência, Origem, Destino)\n\nCom base nas informações e no esquema apresentado, avalie as afirmações a seguir.\n\nI. CodConvênio é uma chave estrangeira na tabela Atendimento.\nII. CodAtendimento não pode ser chave estrangeira na tabela Viagem porque faz parte da chave primária.\nIII. CodPaciente nunca pode assumir valores nulos na tabela Atendimento porque é uma chave estrangeira.\nIV. CodPaciente → Nome, Endereço; CodConvênio → Empresa, Plano; CodAtendimento → CodPaciente, CodConvênio, Data, Finalidade; CodAtendimento, Sequência → Origem, Destino; são dependências funcionais corretamente deduzidas.\n\nÉ correto apenas o que se afirma em:","alt":["I.","II.","I e IV.","II e III.","III e IV."],"correct":"C","anulada":false,"exp":"CodConvênio é de fato chave estrangeira em Atendimento (I verdadeira); CodAtendimento pode sim ser chave estrangeira em Viagem mesmo fazendo parte da chave primária composta (II falsa); CodPaciente poder ou não aceitar nulos depende de regra de negócio, não é automático por ser FK (III falsa); e as dependências funcionais listadas em IV foram corretamente deduzidas a partir das chaves do esquema (IV verdadeira)."},{"id":"2014-31","ano":2014,"n":31,"area":"Banco de Dados","enunciado":"Um sistema de informação usa um banco de dados relacional que possui tabelas cujos esquemas em SQL estão representados a seguir.\n\nCREATE TABLE Artista (\n  id INTEGER PRIMARY KEY,\n  nome VARCHAR(40) NOT NULL,\n  CPF CHAR(11) NOT NULL,\n  dataNascimento DATE,\n  UNIQUE (CPF)\n);\n\nCREATE TABLE Evento (\n  id INTEGER PRIMARY KEY,\n  descricao VARCHAR(60) NOT NULL,\n  numMaxConvidados INTEGER DEFAULT 0,\n  CHECK (numMaxConvidados >= 0)\n);\n\nCREATE TABLE Atuacao (\n  idArtista INTEGER,\n  idEvento INTEGER,\n  PRIMARY KEY (idArtista, idEvento),\n  FOREIGN KEY (idArtista) REFERENCES Artista,\n  FOREIGN KEY (idEvento) REFERENCES Evento(id)\n);\n\nO sistema também possui uma consulta que integra um de seus relatórios, conforme indicado a seguir:\n\nSELECT A.nome, E.descricao\nFROM Evento E FULL JOIN Atuacao T ON E.id = T.idEvento\nFULL OUTER JOIN Artista A ON T.idArtista = A.id\n\nConsiderando que todas as tabelas possuem dados, o resultado da consulta utilizada no relatório é:","alt":["o nome de todos os artistas combinados com a descrição de todos os eventos.","a descrição de todos os eventos e, caso haja artistas alocados, os seus nomes.","o nome de todos os artistas e a descrição de todos os eventos em que eles atuam.","o nome de todos os artistas e, caso eles participem de eventos, a descrição do evento.","o nome de todos os artistas, a descrição de todos os eventos e, caso eles se relacionem, os dois combinados."],"correct":"E","anulada":false,"exp":"FULL OUTER JOIN retorna todas as linhas de ambas as tabelas, combinando quando há correspondência e preenchendo com NULO quando não há — logo, o nome de todos os artistas, a descrição de todos os eventos e, quando relacionados, os dois combinados."},{"id":"2014-32","ano":2014,"n":32,"area":"Engenharia de Software","enunciado":"Considere um cenário de venda de passagens aéreas cujo processo de negócio apresenta-se modelado no diagrama abaixo, usando-se BPMN (Business Process Modeling and Notation): recebimento do pedido de passagem, seguido de um evento intermediário de tempo, verificação de disponibilidade, checagem de crédito (gateway \"Crédito OK?\"), envio de fatura e, em caso de pedido malsucedido, encerramento do processo.\n\nPara que essa companhia aérea obtenha mais retorno, será necessário:","alt":["retirar o evento intermediário de tempo colocado após a tarefa \"Pedido de passagem\".","adicionar uma tarefa para oferecimento de outro voo na raia \"Comercial\".","modelar a tarefa \"Enviar fatura\" como tarefa de serviço (service task).","transformar o gateway \"Crédito OK?\" em um gateway inclusivo.","transformar a tarefa \"Checar crédito\" em um subprocesso."],"correct":"B","anulada":false,"exp":"Para aumentar o retorno sem alterar a lógica do processo, a melhoria mais direta é oferecer ao cliente uma alternativa comercial (outro voo) quando o voo original não estiver disponível, evitando pedidos fracassados sem gerar receita."},{"id":"2014-33","ano":2014,"n":33,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"Um dos recursos utilizados no processo de inclusão digital por meio da utilização de Tecnologias de Informação e Comunicação (TIC) é a implantação de Telecentros Comunitários.\n\nA esse respeito, avalie as asserções a seguir e a relação proposta entre elas.\n\nI. Proporcionar à população mais carente o acesso às tecnologias de informação por meio de Telecentros Comunitários e mediante a capacitação para a utilização desse conhecimento favorece a promoção da cidadania.\n\nPORQUE\n\nII. Telecentros Comunitários possibilitam à população carente o acesso a informações e conhecimentos, estimula a criatividade e garante a inserção profissional no mercado de trabalho.\n\nA respeito dessas asserções, assinale a opção correta.","alt":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"correct":"C","anulada":false,"exp":"Telecentros comunitários de fato favorecem o acesso à informação e promovem a cidadania (asserção I verdadeira); porém garantir 'inserção profissional no mercado de trabalho' apenas por meio deles é uma generalização não sustentada pelo texto (asserção II falsa)."},{"id":"2014-34","ano":2014,"n":34,"area":"Banco de Dados","enunciado":"Nos órgãos públicos, o desafio da gestão do conhecimento é contribuir para a modernização da gestão pública no contexto de um Estado, de forma a garantir-se a participação de toda a sociedade nas atividades desenvolvidas por seus representantes no Executivo, Legislativo e Judiciário.\n\nConsidere soluções de TI para a implementação de uma política pública cujo objetivo seja proporcionar maior transparência aos gastos de um órgão público e que, para tal, tenha-se optado por uma solução baseada em Web Semântica, sendo uma das fases para seu desenvolvimento a disponibilização dos dados referentes aos gastos do órgão.\n\nConsiderando esse cenário, avalie as seguintes asserções e a relação proposta entre elas.\n\nI. A publicação de dados na forma de dados abertos vinculados (Linked Open Data - LOD) é apropriada para o uso generalizado dos dados no âmbito da Web Semântica.\n\nPORQUE\n\nII. Um dos papéis do formato LOD para a Web Semântica é facilitar a integração de dados quando houver ambiguidade de termos utilizados nos diferentes conjuntos de dados.\n\nA respeito dessas asserções, assinale a opção correta.","alt":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"correct":"C","anulada":false,"exp":"A asserção I é verdadeira: dados abertos vinculados (LOD) realmente favorecem o uso generalizado de dados na Web Semântica. Já a asserção II é falsa: o papel do LOD é permitir a interligação entre diferentes conjuntos de dados, e não resolver ambiguidade semântica de termos, tarefa que cabe a ontologias e vocabulários controlados."},{"id":"2014-35","ano":2014,"n":35,"area":"Engenharia de Software","enunciado":"Way back in the late twentieth century, 1997 to be exact, the Object Management Group (OMG) released the Unified Modeling Language (UML). One of the purposes of UML was to provide the development community with a stable and common design language that could be used to develop and build computer applications. UML brought forth a unified standard modeling notation that IT professionals had been wanting for years. Using UML, IT professionals could now read and disseminate system structure and design plans, just as construction workers have been doing for years with blueprints of buildings.\n\nIt is now the twenty-first century, 2003 to be precise, and UML has gained traction in our profession. On 75 percent of the resumes I see, there is a bullet point claiming knowledge of UML. However, after speaking with a majority of these job candidates, it becomes clear that they do not truly know UML. Typically, they are either using it as a buzz word, or they have had a sliver of exposure to UML.\n\nBELL, D. UML basics: an introduction to the unified modeling language. IBM Corporation, 2003. Disponível em: <http://www.ibm.com>. Acesso em: 28 jul. 2014 (adaptado).\n\nCom base no texto e nos conceitos de UML, avalie as afirmações a seguir.\n\nI. Na maioria dos currículos analisados pelo autor, existe alguma indicação de conhecimento da linguagem UML pelo candidato ao emprego.\nII. A UML é composta por diversos diagramas, como diagrama de caso de uso, diagrama de especificação e diagrama de componentes.\nIII. A UML não é uma linguagem de programação, mas, sim, uma linguagem de modelagem padronizada para os profissionais de TI cuja notação independe de processos.\n\nÉ correto o que se afirma em:","alt":["I, apenas.","II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"correct":"C","anulada":false,"exp":"A maioria dos currículos analisados de fato menciona conhecimento em UML (I verdadeira); a UML não é uma linguagem de programação, mas uma linguagem de modelagem padronizada cuja notação (diagramas) independe do processo de desenvolvimento adotado (III verdadeira)."},{"id":"2017-9","ano":2017,"n":9,"area":"Engenharia de Software","enunciado":"Na fase de levantamento de requisitos do processo de desenvolvimento de software, devem-se identificar as regras de negócio, os requisitos funcionais e os requisitos não funcionais do sistema.\n\nConsiderando um cenário em que um vendedor de sorvetes tenha o objetivo de gerenciar suas vendas com o uso de um aplicativo, avalie os itens a seguir.\n\nI. Regra de negócio: entregar o sorvete ao cliente somente mediante pagamento; requisito funcional: reabastecer o estoque quando a quantidade de sorvetes atingir o mínimo; requisito não funcional: especificar o tempo de resposta do aplicativo.\nII. Regra de negócio: aplicar promoções vigentes na realização da venda; requisito funcional: calcular a quantidade de sorvetes no estoque; requisito não funcional: exibir relatório com o balanço de vendas.\nIII. Regra de negócio: aceitar somente pagamentos com cartão de débito ou crédito; requisito funcional: consultar a quantidade de vendas; requisito não funcional: verificar a possibilidade de indisponibilidade do sistema.\nIV. Regra de negócio: conceder aos clientes que comprarem 2 sorvetes um desconto de 10%; requisito funcional: processar a venda do sorvete; requisito não funcional: verificar o tempo gasto com o treinamento para a utilização do aplicativo.\n\nÉ correto apenas o que se descreve em:","alt":["I e II.","II e III.","III e IV.","I, II e IV.","I, III e IV."],"correct":"C","anulada":false,"exp":"Regra de negócio define uma política do domínio (ex.: aceitar só determinado meio de pagamento); requisito funcional descreve uma ação do sistema (consultar, processar); requisito não funcional trata de qualidade (disponibilidade). Apenas os itens III e IV classificam corretamente essas três categorias ao mesmo tempo."},{"id":"2017-10","ano":2017,"n":10,"area":"Engenharia de Software","enunciado":"O Guia do Conhecimento em Gerenciamento de Projetos (Project Management Body of Knowledge - PMBOK) inclui o gerenciamento de riscos como uma das áreas de conhecimento que devem ser observadas para o sucesso do projeto. Os riscos identificados são analisados em função da probabilidade de sua ocorrência e do impacto que causarão ao projeto, caso ocorram.\n\nA respeito da definição de risco em um projeto, de acordo com as orientações do PMBOK, avalie as afirmações a seguir.\n\nI. Os riscos em um projeto podem ocorrer com probabilidade entre 0 e 100%.\nII. O impacto do risco, caso ocorra, pode ser positivo ou negativo.\nIII. Devem ser desconsiderados os riscos que não afetam o objetivo do projeto.\nIV. O valor estimado referente ao impacto deve ser diferente de zero.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","I e IV.","II e III.","I, II e IV.","II, III e IV."],"correct":"E","anulada":false,"exp":"Pelo PMBOK, um risco tem probabilidade estritamente entre 0% e 100% — um evento com certeza absoluta (0% ou 100%) deixa de ser um 'risco' (I falsa); o impacto pode ser positivo (oportunidade) ou negativo (ameaça) (II verdadeira); eventos que não afetam os objetivos do projeto não se caracterizam como risco e podem ser desconsiderados (III verdadeira); e o valor monetário esperado de um risco só é calculado quando diferente de zero (IV verdadeira)."},{"id":"2017-11","ano":2017,"n":11,"area":"Banco de Dados","enunciado":"O diagrama Entidade-Relacionamento (DER) a seguir apresenta a modelagem conceitual de dados de um sistema de informação para um museu. A partir dessa modelagem observa-se o seguinte: uma Obra é criada por um único Artista e um Artista pode criar no mínimo uma Obra e no máximo várias Obras; as entidades Pintura e Escultura são especializações da entidade Obra; um Artista tem o domínio de várias Técnicas, assim como uma Técnica é dominada por diversos Artistas.\n\n(Diagrama: entidade Obra com atributos código, título, data de aquisição, dimensões; relacionamento \"criar\" (1,n) entre Artista e Obra; entidade Artista com atributos código, nome, nacionalidade; relacionamento \"dominar\" (0,n) entre Artista e Técnica; entidade Técnica com atributos código, descrição; especializações Pintura — atributo tipo de tinta — e Escultura — atributo material — a partir de Obra.)\n\nCom base nas regras de mapeamento que transformam o Modelo Conceitual em um Modelo Lógico Relacional, avalie as afirmações a seguir, a respeito do Esquema Lógico Relacional gerado a partir do DER apresentado.\n\nI. No Esquema Lógico Relacional, haverá uma tabela associativa, criada em função do relacionamento muitos para muitos entre as entidades Artista e Técnica, que terá uma chave primária composta pelo código do artista e o código da técnica.\nII. No Esquema Lógico Relacional, haverá uma tabela Artista na qual o atributo código do artista será a chave primária da tabela, e o código da obra será uma chave estrangeira que fará referência a uma obra existente na tabela Obra.\nIII. No Esquema Lógico Relacional, haverá, em função da generalização/especialização, uma tabela Obra com apenas os atributos código da obra, título, data de aquisição e dimensões, e duas outras tabelas: a tabela Pintura, com apenas o atributo tipo de tinta, e a tabela Escultura com apenas o atributo material.\n\nÉ correto o que se afirma em:","alt":["I, apenas.","II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"correct":"A","anulada":false,"exp":"Em relacionamentos N:N, o mapeamento gera uma tabela associativa com chave primária composta pelos códigos das duas entidades (I verdadeira). Já a chave estrangeira de Artista deveria referenciar Obra (não o contrário como diz II), e cada subtabela de especialização (Pintura/Escultura) mantém também a chave herdada de Obra, não apenas o atributo específico — por isso II e III não se sustentam integralmente."},{"id":"2017-12","ano":2017,"n":12,"area":"Hardware / Arquitetura e Sistemas Operacionais","enunciado":"A TI Verde está associada à utilização eficiente dos recursos organizacionais e à minimização dos efeitos nocivos ao meio ambiente ocasionados pelo uso da Tecnologia da Informação (TI). Essas tecnologias são feitas de produtos químicos, metais pesados, materiais sintéticos etc. Considerando que existirão 10 bilhões de pessoas no nosso planeta em 2050, teremos que gerir tanto o impacto ambiental da tecnologia, quanto usar esta mesma tecnologia para ajudar a gerenciar o impacto da espécie humana no planeta.\n\nDisponível em: <http://www.sustentti.com.br>. Acesso em: 21 jul. 2017 (adaptado).\n\nA partir dessas informações e considerando o conceito de TI Verde, avalie as afirmações a seguir.\n\nI. Um dos pilares da TI Verde é a busca de conscientização do usuário na adoção de ações sustentáveis, tais como: reduzir impressões inúteis economizando papel e tinta/toner e evitar o envio desnecessário de e-mails reduzindo o gasto de energia do sistema e do receptor.\nII. Na linha de eficiência energética estão os data centers verdes, nos quais a virtualização de servidores pode ser utilizada para fazer com que uma única máquina física, considerando sua capacidade de processamento, emule diversas máquinas.\nIII. Um equívoco comum é considerar ações relativas ao lixo eletrônico como ações de TI Verde a serem adotadas pela organização, pois essas questões estão fora de sua governança.\n\nÉ correto o que se afirma em:","alt":["I, apenas.","II, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"correct":"C","anulada":false,"exp":"TI Verde envolve tanto a conscientização do usuário (economia de papel, energia) quanto a eficiência energética via virtualização em data centers (I e II verdadeiras); já o lixo eletrônico é sim uma responsabilidade dentro da governança de TI da organização, tornando III falsa."},{"id":"2017-13","ano":2017,"n":13,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"Analise a figura a seguir, que ilustra uma cadeia de valor de uma organização (O'Brien), com processos de apoio (coordenação administrativa e serviços de apoio — intranet de fluxo de trabalho colaborativo; gerenciamento de recursos humanos — intranet de benefícios de funcionários; desenvolvimento tecnológico — extranet de desenvolvimento de produtos com parceiros; obtenção de recursos — portais de e-commerce para fornecedores) e processos primários (logística de entrada — armazenamento automatizado just-in-time; operações — produção flexível apoiada por computador; logística de saída — pontos de venda e processamento de pedidos; marketing e vendas — marketing direcionado ao cliente; e vantagem competitiva on-line — gestão do relacionamento com o cliente).\n\nO'BRIEN, J. A.; MARAKAS, G. M. Administração de sistemas de informação. 15. ed. Porto Alegre: AMGH, 2012 (adaptado).\n\nA partir da análise da figura, avalie as afirmações a seguir.\n\nI. É apresentado um exemplo de como e onde as tecnologias da informação podem ser aplicadas nos processos de negócios por meio da estrutura de cadeia de valor.\nII. É sugerido que um fluxo de trabalho colaborativo pela intranet pode aumentar as comunicações e colaborações necessárias à significativa melhoria da coordenação administrativa e dos serviços de apoio.\nIII. É sugerido que os portais de e-commerce podem melhorar a economia de recursos ao oferecer mercados on-line para os fornecedores.\nIV. É demonstrado que a vantagem competitiva é ampliada quando a área de Tecnologia da Informação (TI) está alinhada ao negócio.\n\nÉ correto o que se afirma em:","alt":["I, II e III, apenas.","I, II e IV, apenas.","I, III e IV, apenas.","II, III e IV, apenas.","I, II, III e IV."],"correct":"E","anulada":false,"exp":"A cadeia de valor de O'Brien mostra como a TI apoia cada processo de negócio (I), melhora a coordenação via intranet colaborativa (II), otimiza recursos via portais de e-commerce com fornecedores (III) e amplia a vantagem competitiva quando alinhada ao negócio (IV) — as quatro afirmações são coerentes com a figura e o texto."},{"id":"2017-14","ano":2017,"n":14,"area":"Outros temas de SI (não cobertos pelas 6 áreas solicitadas)","enunciado":"No passado, registrar e montar estatísticas sobre jogadas e associá-las a vídeos com momentos do jogo não era trivial, o que dificultava a tomada de decisão por uma organização esportiva. Atualmente, existem sistemas de informação com capacidade para coletar jogadas, organizá-las em dados estatísticos e relacioná-las às imagens de jogos. Por meio desses sistemas, cada lance dos jogos é registrado de forma detalhada, dissecando-os e marcando-os com o uso de centenas de descritores e associando-os a vídeos em alta resolução. Assim, treinadores podem utilizar o sistema para, em segundos, acessar momentos de interesse e avaliar forças e debilidades de jogadores; jogadores podem analisar suas jogadas e se preparar para os próximos jogos; torcedores, \"olheiros\" e patrocinadores podem acessar estatísticas e jogadas. Portanto, é possível criar uma rede de tomada de decisões, relacionamentos e valores de negócio.\n\nLAUDON, K. C.; LAUDON, J. P. Management information systems. 11. ed. New Jersey: Pearson, 2010 (adaptado).\n\nEm relação ao cenário descrito, avalie as afirmações a seguir.\n\nI. O alto custo dos jogadores, a alta pressão competitiva e a baixa qualidade estatística dos jogos são problemas ou desafios superados por uma organização esportiva que utiliza um sistema de informação.\nII. O desenvolvimento de estratégia para o time, o treinamento e a avaliação de jogadores, são funções gerenciais de uma organização esportiva apoiadas por um sistema de informação.\nIII. São funcionalidades de um sistema de informação para uma organização esportiva: geração de relatórios de análise do desempenho de jogadores e relatórios de análise do desempenho de equipes.\nIV. O aumento do desempenho e da receita dos times são objetivos de negócio impactados com a utilização de um sistema de informação por uma organização esportiva.\n\nÉ correto o que se afirma em (questão anulada no gabarito oficial):","alt":["I, apenas.","I e III, apenas.","II e IV, apenas.","I, III e IV, apenas.","I, II, III e IV."],"correct":null,"anulada":true,"exp":"Esta questão foi anulada pelo INEP no gabarito oficial e não possui resposta correta definida — sirva-se dela apenas como material de leitura sobre sistemas de informação aplicados à gestão esportiva."},{"id":"2017-15","ano":2017,"n":15,"area":"Engenharia de Software","enunciado":"Os sistemas de informação ampliaram sua perspectiva de atuação do simples uso do computador como ferramenta para a rápida execução de tarefas rotineiras até o campo dos negócios. Tal fato, aliado às possibilidades providas pelas Tecnologias da Informação e Comunicação (TIC) e pelos avanços específicos em hardware, software, nuvem, conectividade e redes sociais, ampliou as exigências em relação aos sistemas.\n\nComo forma de contribuir para o processo de desenvolvimento e implantação, surgiu a abordagem da Arquitetura de Sistemas de Informação (ASI). Inicialmente tratada como arquitetura de dados, a ASI acompanhou a evolução dos sistemas de informação e incorporou uma visão mais abrangente, com a inclusão das perspectivas de negócio, da visão organizacional, da evolução das TIC e dos usuários.\n\nTAIT, T. C.; PACHECO, R. C.; ABREU, A. F. Arquitetura de sistemas de informação: análise comparativa de modelos. Produção, Rio de Janeiro, v. 9, n. 1, p. 55-64, 1999 (adaptado).\n\nConsiderando esse cenário, avalie as asserções a seguir e a relação proposta entre elas.\n\nI. A abordagem ASI estabelece um mapeamento da organização que considera os elementos envolvidos com o processo de desenvolvimento/implantação de sistemas de informação.\n\nPORQUE\n\nII. O objetivo da ASI é inter-relacionar dados, disponibilizar hardware, software e recursos de redes, para processar transações, produzir informação e suportar uma variedade de domínios de aplicação.\n\nA respeito dessas asserções, assinale a opção correta.","alt":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"correct":"A","anulada":false,"exp":"A Arquitetura de Sistemas de Informação (ASI) de fato mapeia a organização considerando os elementos do processo de desenvolvimento/implantação (I), e seu objetivo é justamente inter-relacionar dados, hardware, software e redes para produzir informação (II) — a II justifica corretamente a I."},{"id":"2017-16","ano":2017,"n":16,"area":"IHC (Interação Humano-Computador)","enunciado":"O processo de design de interação possui quatro atividades básicas: identificar as necessidades e estabelecer requisitos, desenvolver designs alternativos que preencham estes requisitos, construir versões interativas dos designs e avaliação.\n\nNesse contexto, avalie as afirmações a seguir.\n\nI. O processo de design de interação é complementar aos modelos de ciclo de vida de desenvolvimento de software.\nII. A participação do usuário do sistema no processo de design de interação é dispensável, uma vez que os desenvolvedores conhecem todas as regras referentes ao web design.\nIII. A observação de designs de interação desenvolvidos por outros profissionais motiva os designers para soluções alternativas.\nIV. A prototipagem é uma técnica para facilitar o feedback do usuário nas etapas do processo de design de interação.\n\nÉ correto apenas o que se afirma em:","alt":["I.","I e III.","I e IV.","I, III e IV.","II e IV."],"correct":"D","anulada":false,"exp":"O design de interação complementa, não substitui, o ciclo de vida de desenvolvimento de software (I verdadeira); a participação do usuário é essencial, não dispensável (II falsa); observar designs de outros profissionais de fato inspira soluções alternativas (III verdadeira); e a prototipagem é a técnica clássica para obter feedback do usuário (IV verdadeira)."},{"id":"2017-17","ano":2017,"n":17,"area":"Engenharia de Software","enunciado":"Uma equipe de projeto desenvolveu um aplicativo mobile para a gestão de frotas de caminhões entre os meses de janeiro e junho de 2017. O projeto seguiu um processo baseado no modelo de ciclo de vida de desenvolvimento em cascata, com atividades realizadas sequencialmente e sem sobreposição.\n\nAo final do projeto, a equipe precisou tratar uma grande quantidade de defeitos encontrados no aplicativo em um curto espaço de tempo. Como mostra o gráfico apresentado na prova, a maior parte dos defeitos foi identificada ao final do projeto, o que elevou o risco de se entregar o aplicativo com muitos defeitos ao cliente.\n\nDiante desse cenário, a equipe do projeto decidiu que, em novos projetos, realizaria ações que pudessem distribuir o esforço de tratamento de defeitos ao longo dos meses, diminuindo o risco de ainda haver muitos defeitos não tratados no momento próximo à entrega do produto.\n\nConsiderando a situação, o gráfico apresentado e o modelo de ciclo de vida de desenvolvimento utilizado no projeto (cascata), assinale a opção que descreve uma ação capaz de produzir o resultado esperado pela equipe.","alt":["Realizar testes assim que o aplicativo estiver pronto para uso.","Aplicar técnicas de verificação e validação desde o início do projeto.","Mapear e documentar o processo de desenvolvimento utilizado e comunicá-lo à equipe.","Elicitar e documentar os requisitos funcionais e não funcionais do produto logo no início do projeto.","Registrar, evidenciar e comunicar imediatamente os defeitos encontrados aos demais membros da equipe."],"correct":"B","anulada":false,"exp":"Como o modelo em cascata não prevê retrabalho antes do final, a única forma de evitar a concentração de defeitos ao término do projeto é antecipar as atividades de verificação e validação (testes) para etapas iniciais do desenvolvimento, em vez de deixá-las só para o fim."},{"id":"2017-18","ano":2017,"n":18,"area":"Engenharia de Software","enunciado":"Uma empresa iniciou um projeto para implantação de um ERP (Enterprise Resource Planning), com o objetivo de aumentar a produtividade e elevar seu patamar tecnológico. O sistema que era utilizado anteriormente foi desenvolvido pela própria empresa e não mais atendia às necessidades operacionais. A empresa optou por implantar um módulo WMS (Warehouse Management System), que se ocupa de tarefas relacionadas ao gerenciamento das operações de estoques. O módulo foi parametrizado e customizado de acordo com as necessidades identificadas na fase de planejamento do projeto de implantação.\n\nA partir do caso apresentado, avalie as asserções a seguir e a relação proposta entre elas.\n\nI. Customização é a modificação de um sistema ERP para que ele possa adaptar-se a determinada situação empresarial que não pode ser reproduzida por parâmetros preexistentes.\n\nPORQUE\n\nII. A parametrização é o processo de determinação do comportamento de um sistema ERP por meio da definição dos valores de parâmetros disponibilizados por ele, que são variáveis internas.\n\nA respeito dessas asserções, assinale a opção correta.","alt":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.","As asserções I e II são proposições falsas."],"correct":"B","anulada":false,"exp":"Customização de fato adapta o ERP a situações não cobertas pelos parâmetros disponíveis (I verdadeira), e essa adaptação só é possível justamente porque a parametrização define o comportamento do sistema por meio de variáveis internas configuráveis (II verdadeira e justifica corretamente a I)."},{"id":"2017-19","ano":2017,"n":19,"area":"Lógica e Programação","enunciado":"A teoria dos grafos estuda as relações entre elementos em um determinado conjunto. Um grafo G(V,E) é determinado por um conjunto não vazio de vértices (V) e um subconjunto de pares de vértices não ordenados, chamados arestas (E).\n\nA figura a seguir representa a possibilidade de voos de uma companhia aérea tal que V = {Porto Alegre, Curitiba, São Paulo, Rio de Janeiro, Brasília}, representa o conjunto das capitais (vértices), e E = {{Porto Alegre, Curitiba}, {Curitiba, São Paulo}, {São Paulo, Rio de Janeiro}, {Porto Alegre, Rio de Janeiro}, {São Paulo, Brasília}}, representa essas possíveis conexões (arestas) entre as capitais.\n\nCom base nas informações apresentadas, avalie as afirmações a seguir.\n\nI. São Paulo é adjacente a Porto Alegre.\nII. Porto Alegre possui valência igual a 2.\nIII. Rio de Janeiro é incidente em São Paulo e Porto Alegre.\nIV. Curitiba possui comprimento igual a 2.\n\nÉ correto apenas o que se afirma em:","alt":["I e III.","I e IV.","II e III.","II e IV.","I, II e IV."],"correct":"B","anulada":false,"exp":"São Paulo conecta-se a Curitiba, Rio de Janeiro e Brasília, mas não a Porto Alegre diretamente (I falsa); Porto Alegre liga-se a Curitiba e a Rio de Janeiro, logo tem grau (valência) 2 (II verdadeira); Rio de Janeiro conecta-se a São Paulo e a Porto Alegre, sendo incidente nessas arestas (III verdadeira); 'comprimento' não é um atributo padrão de vértice em teoria dos grafos, tornando IV sem sentido/falsa."},{"id":"2017-20","ano":2017,"n":20,"area":"Lógica e Programação","enunciado":"Em uma seleção para uma vaga de programador, o setor de recursos humanos de uma empresa criou três sentenças essenciais para a escolha do candidato, representadas pelas variáveis proposicionais p, q e r:\n\n• p: o candidato tem experiência com a linguagem Python;\n• q: o candidato tem experiência com a linguagem Java;\n• r: o candidato é pouco experiente como programador.\n\nA partir das três sentenças criadas, foi gerada uma proposição composta S para avaliação dos candidatos: S = (p ∨ q) ∧ (q ∧ r → r).\n\nAssinale a opção que representa corretamente a tabela-verdade do cálculo proposicional S. (As cinco alternativas A a E apresentam tabelas-verdade completas para p, q, r, (p∨q), (q∧r→r) e S — recomenda-se consultar a imagem original da prova para conferir os valores lógicos linha a linha de cada alternativa.)","alt":["(tabela-verdade — ver imagem original)","(tabela-verdade — ver imagem original)","(tabela-verdade — ver imagem original)","(tabela-verdade — ver imagem original)","(tabela-verdade — ver imagem original)"],"correct":"E","anulada":false,"exp":"A tabela-verdade de S = (p∨q) ∧ (q∧r → r) deve ser construída avaliando cada uma das 8 combinações de p, q e r; a alternativa E corresponde ao resultado correto dessa avaliação — vale conferir linha a linha na imagem da questão."},{"id":"2017-21","ano":2017,"n":21,"area":"Engenharia de Software","enunciado":"Uma startup de tecnologia pretende desenvolver um aplicativo que aproxime empresas que precisam transportar mercadorias de condutores autônomos de veículos de carga (transportadores). O uso do aplicativo permitirá um aumento do número potencial de transportadores e de tipos de veículos, bem como o compartilhamento de frete, com redução do custo de transporte e do custo de armazenamento de mercadorias pelas empresas. Além disso, a visibilidade da disponibilidade dos transportadores pelo aplicativo pode aumentar suas possibilidades de negócios. Durante a concepção e o projeto do aplicativo, foram elaborados modelos UML (Unified Modeling Language), sendo um deles o diagrama de atividades, envolvendo raias para \"Empresa que precisa do transporte\", \"Aplicativo\" e \"Transportador\", com pontos de decisão sobre disponibilidade de veículos, tipo de veículo e confirmação/indisponibilidade do motorista.\n\nCom base no diagrama apresentado, avalie as afirmações a seguir.\n\nI. Os serviços oferecidos por outros aplicativos, como mapas para o cálculo de rotas, por exemplo, poderão ser usados no desenvolvimento do aplicativo, mesmo que não tenham sido representados no diagrama.\nII. Os fluxos paralelos indicados nos pontos de decisão 2 e 3 levam a erros no funcionamento do aplicativo, uma vez que permitem a continuidade do processo mesmo que não haja rota, destino ou tipo de veículo adequado.\nIII. O diagrama apresenta atividades desempenhadas pela \"Empresa que precisa de transporte\" e pelo \"Transportador\", no entanto, as atividades que precisarão ser modeladas no sistema restringem-se às desempenhadas pelo \"Aplicativo\".\nIV. As ações \"Informar indisponibilidade\" e \"Confirmar disponibilidade\" correspondem a funcionalidades distintas no sistema, visto que a primeira se relaciona à existência de tipo de veículo, rota e destino e a segunda se relaciona à agenda do transportador.\n\nÉ correto apenas o que se afirma em:","alt":["I e II.","I e IV.","II e III.","I, II e IV.","II, III e IV."],"correct":"B","anulada":false,"exp":"O aplicativo pode incorporar serviços externos não representados no diagrama, como um serviço de mapas para cálculo de rotas (I verdadeira); e as ações 'Informar indisponibilidade' e 'Confirmar disponibilidade' realmente correspondem a funcionalidades distintas, ligadas a validações diferentes (tipo de veículo/rota vs. agenda do transportador) (IV verdadeira). Já os fluxos paralelos nos pontos de decisão não geram erro por si só (II falsa), e as atividades de outras raias também precisam ser consideradas na modelagem do sistema como um todo (III falsa)."},{"id":"2017-22","ano":2017,"n":22,"area":"Hardware / Arquitetura e Sistemas Operacionais","enunciado":"A tendência atual de desenvolver aplicações que possam ser utilizadas em nuvem otimiza o desempenho de máquinas locais, munidas de poucos recursos computacionais, em uma rede e garante a possibilidade desses computadores utilizarem outros recursos computacionais de maior desempenho, bem como a inserção de novos hosts neste ambiente computacional, sem comprometimento do sistema como um todo.\n\nEsse cenário pressupõe a utilização de sistema operacional com:","alt":["arquitetura monolítica.","arquitetura em camadas.","arquitetura monocamada.","arquitetura cliente-servidor.","arquitetura de máquinas virtuais."],"correct":"D","anulada":false,"exp":"A tendência de usar máquinas locais com poucos recursos, aproveitando recursos remotos de maior
