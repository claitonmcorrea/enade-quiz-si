      var list = questionsByArea(area);
      if (list.length === 0) return;
      var s = areaStats(area);
      var pctWidth = s.totalAll ? Math.round(100*s.answeredAll/s.totalAll) : 0;
      var color = AREA_COLORS[area] || 'var(--ink)';
      var label = s.answeredAll === 0 ? 'Começar' : (s.answeredAll === s.totalAll ? 'Revisar' : 'Continuar');
      html += '<li class="area-item">';
      html += '<div class="accent" style="background:'+color+'"></div>';
      html += '<div class="info">';
      html += '<div class="name">'+esc(area)+'</div>';
      html += '<div class="meta">'+list.length+' questões · '+s.answeredAll+'/'+s.totalAll+' respondidas'+(s.answered>0 ? ' · '+s.correct+' de '+s.answered+' certas' : '')+'</div>';
      html += '<div class="progress-track"><div class="progress-fill" style="width:'+pctWidth+'%;background:'+color+'"></div></div>';
      html += '</div>';
      html += '<button class="go" data-area="'+esc(area)+'">'+label+'</button>';
      html += '</li>';
    });
    html += '</ul>';

    var overall = overallStats();
    html += '<div class="report-cta">';
    html += '<div><strong>Relatório de desempenho</strong><p>'+overall.answered+' de '+overall.total+' questões respondidas no total.</p></div>';
    html += '<button class="btn ghost" id="btnReport">Ver relatório</button>';
    html += '</div>';

    mainEl.innerHTML = html;

    document.getElementById('studentName').addEventListener('input', function(e){
      state.studentName = e.target.value;
      saveState();
    });
    Array.prototype.forEach.call(document.querySelectorAll('.area-item button.go'), function(btn){
      btn.addEventListener('click', function(){
        startArea(btn.getAttribute('data-area'));
      });
    });
    document.getElementById('btnReport').addEventListener('click', renderReport);
  }

  // ---------------- QUIZ VIEW ----------------
  function startArea(area){
    var list = questionsByArea(area);
    var savedIdx = (state.nav.area === area) ? (state.nav.index||0) : 0;
    // resume at first unanswered question if fully re-entering
    var idx = savedIdx;
    if (state.nav.area !== area){
      var firstUnanswered = list.findIndex(function(q){ return !state.answers[q.id] || !state.answers[q.id].selected; });
      idx = firstUnanswered === -1 ? 0 : firstUnanswered;
    }
    state.nav.area = area;
    state.nav.index = idx;
    state.nav.view = 'quiz';
    saveState();
    renderQuiz();
  }

  function renderQuiz(){
    var area = state.nav.area;
    var list = questionsByArea(area);
    var idx = Math.max(0, Math.min(state.nav.index||0, list.length-1));
    var q = list[idx];
    var ans = state.answers[q.id];

    renderCrumb('quiz', area);
    var pct = Math.round(100*(idx)/list.length);
    progressbarFillEl.style.width = pct + '%';

    var color = AREA_COLORS[area] || 'var(--ink)';
    var html = '';
    html += '<div class="q-meta">';
    html += '<span class="tag" style="background:'+color+'">ENADE '+q.ano+' · Questão '+q.n+'</span>';
    html += '<span class="pos">Questão '+(idx+1)+' de '+list.length+'</span>';
    html += '</div>';

    if (q.anulada){
      html += '<div class="anulada-note">Esta questão foi <strong>anulada</strong> pelo INEP no gabarito oficial e não entra no cálculo de acertos — mas vale como exercício.</div>';
    }

    var qClass = looksLikeCode(q.enunciado) ? 'q-text code' : 'q-text';
    html += '<div class="'+qClass+'">'+esc(q.enunciado)+'</div>';

    html += '<ul class="alts" id="altsList">';
    var letters = ['A','B','C','D','E'];
    q.alt.forEach(function(text, i){
      var letter = letters[i];
      var liClasses = [];
      if (ans && ans.selected){
        liClasses.push('answered');
        if (!q.anulada){
          if (letter === q.correct) liClasses.push('is-correct');
          else if (letter === ans.selected) liClasses.push('is-wrong');
        }
      }
      var altClass = looksLikeCode(text) ? 'alt-text code' : 'alt-text';
      html += '<li class="'+liClasses.join(' ')+'">';
      html += '<label>';
      html += '<input type="radio" name="alt" value="'+letter+'" '+(ans && ans.selected===letter ? 'checked' : '')+' '+(ans && ans.selected ? 'disabled' : '')+'>';
      html += '<span class="badge">'+letter+'</span>';
      html += '<span class="'+altClass+'">'+esc(text)+'</span>';
      html += '</label>';
      html += '</li>';
    });
    html += '</ul>';

    html += '<div id="feedbackSlot">';
    if (ans && ans.selected){
      html += feedbackHtml(q, ans);
    }
    html += '</div>';

    if (!(ans && ans.selected)){
      html += '<button class="btn" id="btnResponder" disabled>Responder</button>';
    }

    html += '<div class="actions-row" style="margin-top:20px;">';
    html += '<div class="left-group">';
    html += '<button class="btn subtle" id="btnPrev" '+(idx===0?'disabled':'')+'>← Anterior</button>';
    html += '<label class="doubt-toggle'+(ans && ans.duvida ? ' active':'')+'" id="doubtToggle">';
    html += '<input type="checkbox" id="doubtCheck" '+(ans && ans.duvida ? 'checked':'')+'> Tenho dúvida nesta questão';
    html += '</label>';
    html += '</div>';
    html += '<div class="right-group">';
    if (idx < list.length - 1){
      html += '<button class="btn" id="btnNext">Próxima questão →</button>';
    } else {
      html += '<button class="btn" id="btnFinish">Ver relatório</button>';
    }
    html += '</div>';
    html += '</div>';

    mainEl.innerHTML = html;
    wireQuizEvents(q, list, idx);
  }

  function feedbackHtml(q, ans){
    if (q.anulada){
      return '<div class="feedback neutral"><h3>Questão anulada</h3><p>'+esc(q.exp)+'</p></div>';
    }
    if (ans.correct){
      return '<div class="feedback"><h3>Resposta correta!</h3><p>'+esc(q.exp)+'</p></div>';
    }
    return '<div class="feedback wrong"><h3>Resposta incorreta — a alternativa correta é '+q.correct+'</h3><p>'+esc(q.exp)+'</p></div>';
  }

  function wireQuizEvents(q, list, idx){
    var radios = document.querySelectorAll('input[name="alt"]');
    var btnResponder = document.getElementById('btnResponder');
    Array.prototype.forEach.call(radios, function(r){
      r.addEventListener('change', function(){
        if (btnResponder) btnResponder.disabled = false;
      });
    });
    if (btnResponder){
      btnResponder.addEventListener('click', function(){
        var checked = document.querySelector('input[name="alt"]:checked');
        if (!checked) return;
        var selected = checked.value;
        var correct = !q.anulada && selected === q.correct;
        var prev = state.answers[q.id] || {};
        state.answers[q.id] = {
          selected: selected,
          correct: correct,
          duvida: !!prev.duvida,
          ts: Date.now()
        };
        saveState();
        renderQuiz();
      });
    }
    var btnPrev = document.getElementById('btnPrev');
    if (btnPrev) btnPrev.addEventListener('click', function(){
      state.nav.index = idx - 1;
      saveState();
      renderQuiz();
    });
    var btnNext = document.getElementById('btnNext');
    if (btnNext) btnNext.addEventListener('click', function(){
      state.nav.index = idx + 1;
      saveState();
      renderQuiz();
    });
    var btnFinish = document.getElementById('btnFinish');
    if (btnFinish) btnFinish.addEventListener('click', renderReport);

    var doubtCheck = document.getElementById('doubtCheck');
    if (doubtCheck){
      doubtCheck.addEventListener('change', function(){
        var prev = state.answers[q.id] || { selected: null, correct: false };
        prev.duvida = doubtCheck.checked;
        state.answers[q.id] = prev;
        saveState();
        var toggle = document.getElementById('doubtToggle');
        toggle.classList.toggle('active', doubtCheck.checked);
      });
    }
  }

  // ---------------- REPORT VIEW ----------------
  function renderReport(){
    state.nav.view = 'report';
    saveState();
    renderCrumb('report');

    var overall = overallStats();
    var html = '';
    html += '<h2 class="section-title">Relatório de desempenho</h2>';
    html += '<p class="section-sub">Aluno(a): <strong>'+esc(state.studentName || '(nome não informado)')+'</strong></p>';

    html += '<table class="report-table">';
    html += '<thead><tr><th>Área</th><th class="num">Respondidas</th><th class="num">Certas</th><th class="num">Aproveitamento</th></tr></thead><tbody>';
    AREAS.forEach(function(area){
      var list = questionsByArea(area);
      if (list.length === 0) return;
      var s = areaStats(area);
      var pct = s.answered ? Math.round(100*s.correct/s.answered) : 0;
      html += '<tr><td>'+esc(area)+'</td><td class="num">'+s.answered+'/'+s.total+'</td><td class="num">'+s.correct+'</td>';
      html += '<td class="num">'+(s.answered? pct+'%':'—')+'<span class="bar-track"><span class="bar-fill" style="width:'+pct+'%"></span></span></td></tr>';
    });
    var overallPct = overall.answered ? Math.round(100*overall.correct/overall.answered) : 0;
    html += '<tr class="total-row"><td>Total geral</td><td class="num">'+overall.answered+'/'+overall.total+'</td><td class="num">'+overall.correct+'</td>';
    html += '<td class="num">'+(overall.answered? overallPct+'%':'—')+'<span class="bar-track"><span class="bar-fill" style="width:'+overallPct+'%"></span></span></td></tr>';
    html += '</tbody></table>';

    html += '<h2 class="section-title">Questões com dúvida sinalizada</h2>';
    var doubts = allDoubts();
    if (doubts.length === 0){
      html += '<p class="empty-note">Nenhuma dúvida sinalizada até agora.</p>';
    } else {
      html += '<p class="section-sub">Essas questões podem ser encaminhadas ao professor da respectiva área.</p>';
      html += '<ul class="doubt-list">';
      doubts.forEach(function(q){
        html += '<li><div class="dq-head">'+esc(q.area)+' — ENADE '+q.ano+', Questão '+q.n+'</div>';
        html += '<div class="dq-text">'+esc(q.enunciado.slice(0,160))+(q.enunciado.length>160?'…':'')+'</div></li>';
      });
      html += '</ul>';
    }

    html += '<footer class="export">';
    html += '<button class="btn" id="btnDownload">Baixar relatório (.txt)</button>';
    html += '<button class="btn ghost" id="btnCopy">Copiar relatório</button>';
    html += '<button class="btn subtle" id="btnReset">Reiniciar tudo</button>';
    html += '</footer>';

    mainEl.innerHTML = html;

    document.getElementById('btnDownload').addEventListener('click', function(){
      downloadReport();
    });
    document.getElementById('btnCopy').addEventListener('click', function(){
      copyReport();
    });
    document.getElementById('btnReset').addEventListener('click', function(){
      if (confirm('Isso vai apagar todas as respostas salvas neste navegador. Deseja continuar?')){
        localStorage.removeItem(STORAGE_KEY);
        state = { studentName:"", answers:{}, nav:{} };
        goHome();
      }
    });
  }

  function buildReportText(){
    var overall = overallStats();
    var lines = [];
    lines.push('RELATÓRIO — ENADE Treino por Área (Sistemas de Informação)');
    lines.push('Aluno(a): ' + (state.studentName || '(nome não informado)'));
    lines.push('Data: ' + new Date().toLocaleString('pt-BR'));
    lines.push('');
    lines.push('DESEMPENHO POR ÁREA');
    AREAS.forEach(function(area){
      var list = questionsByArea(area);
      if (list.length === 0) return;
      var s = areaStats(area);
      var pct = s.answered ? Math.round(100*s.correct/s.answered) : 0;
      lines.push('- ' + area + ': ' + s.answered + '/' + s.total + ' respondidas, ' + s.correct + ' certas (' + (s.answered? pct+'%':'—') + ')');
    });
    var overallPct = overall.answered ? Math.round(100*overall.correct/overall.answered) : 0;
    lines.push('');
    lines.push('TOTAL GERAL: ' + overall.answered + '/' + overall.total + ' respondidas, ' + overall.correct + ' certas (' + (overall.answered? overallPct+'%':'—') + ')');
    lines.push('');
    lines.push('QUESTÕES COM DÚVIDA SINALIZADA');
    var doubts = allDoubts();
    if (doubts.length === 0){
      lines.push('Nenhuma.');
    } else {
      doubts.forEach(function(q){
        lines.push('- [' + q.area + '] ENADE ' + q.ano + ', Questão ' + q.n + ': ' + q.enunciado.slice(0,160).replace(/\n/g,' ') + (q.enunciado.length>160?'…':''));
      });
    }
    return lines.join('\n');
  }

  function downloadReport(){
    var text = buildReportText();
    var blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var safeName = (state.studentName||'aluno').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'aluno';
    a.href = url;
    a.download = 'relatorio_enade_' + safeName + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function copyReport(){
    var text = buildReportText();
    var btn = document.getElementById('btnCopy');
    function done(ok){
      if (!btn) return;
      var original = 'Copiar relatório';
      btn.textContent = ok ? 'Copiado!' : 'Não foi possível copiar';
      setTimeout(function(){ btn.textContent = original; }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(false); });
    } else {
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done(true);
      }catch(e){ done(false); }
    }
  }

  // ---------------- init ----------------
  function init(){
    var view = state.nav.view;
    if (view === 'quiz' && state.nav.area){
      renderQuiz();
    } else if (view === 'report'){
      renderReport();
    } else {
      renderHome();
    }
  }

  init();
})();

</script>
</body>
</html>
